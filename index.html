<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>星际战机 · 飞机大战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root{
    --neon:#22e6ff; --neon2:#c05cff; --gold:#ffd76a; --danger:#ff4d6d;
    --bg0:#06040f; --bg1:#140a30; --panel:rgba(26,16,54,.74);
    --stroke:rgba(180,140,255,.30);
  }
  html,body{ height:100%; }
  body{
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:
      radial-gradient(900px 700px at 82% 8%, rgba(255,64,160,.20), transparent 60%),
      radial-gradient(1000px 800px at 12% 88%, rgba(120,60,255,.22), transparent 62%),
      radial-gradient(1200px 900px at 50% -12%, #2a1250 0%, #140a30 42%, #06040f 100%);
    color:#f3eaff; overflow:hidden; user-select:none;
  }
  #app{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:1; }
  #wrap{
    position:relative; width:min(100vw,480px); height:min(100vh,860px);
    box-shadow:0 0 70px rgba(170,60,255,.4), 0 0 30px rgba(255,60,150,.25), inset 0 0 0 1px rgba(180,140,255,.18);
    overflow:hidden; background:#050211;
  }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  /* ---------- Overlays ---------- */
  .screen{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:28px;
    background:
      radial-gradient(500px 400px at 78% 18%, rgba(255,64,160,.22), transparent 60%),
      radial-gradient(600px 500px at 50% 34%, rgba(120,60,255,.30), rgba(5,2,17,.92));
    backdrop-filter:blur(3px); z-index:5; text-align:center;
    animation:fade .4s ease;
  }
  .hidden{ display:none !important; }
  @keyframes fade{ from{opacity:0; transform:scale(.98)} to{opacity:1; transform:scale(1)} }

  .logo{ font-size:44px; font-weight:900; letter-spacing:2px; line-height:1.05;
    background:linear-gradient(180deg,#fff, var(--neon) 60%, var(--neon2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 28px rgba(34,230,255,.35); }
  .sub{ font-size:13px; letter-spacing:6px; color:#8fb0ff; text-transform:uppercase; opacity:.85; }

  .card{
    width:100%; max-width:360px; background:var(--panel); border:1px solid var(--stroke);
    border-radius:18px; padding:22px 20px; box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  label.field{ display:block; text-align:left; font-size:12px; color:#9fb6ff; margin:0 4px 8px; letter-spacing:1px; }
  .nick-row{ display:flex; gap:10px; }
  input#nick{
    flex:1; background:rgba(6,10,30,.8); border:1px solid var(--stroke); color:#fff;
    border-radius:12px; padding:9px 12px; font-size:13px; outline:none; transition:.2s;
  }
  input#nick:focus{ border-color:var(--neon); box-shadow:0 0 0 3px rgba(34,230,255,.18); }
  .btn{
    border:none; cursor:pointer; border-radius:12px; font-weight:700; letter-spacing:1px;
    padding:10px 14px; font-size:13px; color:#04121a; transition:transform .12s, box-shadow .2s, filter .2s;
    background:linear-gradient(135deg, var(--neon), #4fd6ff 40%, var(--neon2));
    box-shadow:0 8px 24px rgba(34,230,255,.35);
  }
  .btn:hover{ transform:translateY(-2px); filter:brightness(1.08); }
  .btn:active{ transform:translateY(0); }
  .btn.dice{ flex:none; width:44px; padding:0; font-size:18px; background:linear-gradient(135deg,#2a3570,#4658b8); color:#fff; box-shadow:0 8px 24px rgba(60,90,255,.35); }
  .btn.ghost{ background:transparent; color:#bcd0ff; border:1px solid var(--stroke); box-shadow:none; }
  .btn.big{ width:100%; margin-top:14px; font-size:14px; padding:12px; }

  .hint{ font-size:12px; color:#7f96d6; margin-top:14px; line-height:1.7; }
  .kbd{ display:inline-block; background:rgba(120,160,255,.15); border:1px solid var(--stroke); border-radius:6px; padding:1px 7px; font-size:11px; }

  /* ---------- HUD ---------- */
  #hud{ position:absolute; inset:0; pointer-events:none; z-index:4; }
  .hud-top{ position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:14px 16px; }
  .score-box{ font-weight:900; font-size:15px; }
  .score-box .num{ font-size:26px; color:var(--gold); text-shadow:0 0 18px rgba(255,215,106,.5); }
  .score-box small{ display:block; color:#8fb0ff; font-size:10px; letter-spacing:2px; }
  .stat-right{ text-align:right; font-size:12px; color:#9fb6ff; }
  .lives{ display:flex; gap:5px; justify-content:flex-end; margin-top:4px; }
  .life{ width:14px; height:14px; filter:drop-shadow(0 0 5px var(--danger)); }
  .bar{ width:120px; height:7px; border-radius:6px; background:rgba(255,255,255,.12); overflow:hidden; margin-top:8px; margin-left:auto; border:1px solid var(--stroke); }
  .bar > i{ display:block; height:100%; width:100%; background:linear-gradient(90deg,#3affa3,#ffe14d,#ff4d6d); transition:width .15s; }
  #pauseBtn{ pointer-events:auto; }

  /* ---------- Leaderboard ---------- */
  .board{ width:100%; max-width:360px; text-align:left; }
  .board h3{ font-size:14px; color:#9fb6ff; letter-spacing:2px; margin:6px 4px 10px; display:flex; justify-content:space-between; align-items:center;}
  .board .clear{ font-size:11px; color:#7f96d6; cursor:pointer; pointer-events:auto; }
  ol.rank{ list-style:none; display:flex; flex-direction:column; gap:7px; max-height:230px; overflow:auto; }
  ol.rank li{ display:flex; align-items:center; gap:10px; background:rgba(10,16,44,.7); border:1px solid var(--stroke);
    border-radius:11px; padding:9px 12px; font-size:14px; }
  ol.rank li .no{ width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:800; background:rgba(120,160,255,.2); }
  ol.rank li.top1 .no{ background:linear-gradient(135deg,#ffd76a,#ff9f1c); color:#3a2400; }
  ol.rank li.top2 .no{ background:linear-gradient(135deg,#dfe8ff,#9fb6ff); color:#1a2340; }
  ol.rank li.top3 .no{ background:linear-gradient(135deg,#ffbf87,#d9843d); color:#3a2400; }
  ol.rank li .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  ol.rank li .sc{ color:var(--gold); font-weight:800; }
  ol.rank li.me{ box-shadow:0 0 0 2px var(--neon); }
  .empty{ color:#6b7fbf; font-size:13px; text-align:center; padding:24px 0; }

  .final-score{ font-size:15px; color:#9fb6ff; }
  .final-score b{ font-size:40px; color:var(--gold); display:block; text-shadow:0 0 24px rgba(255,215,106,.5); }
  .newrec{ color:var(--gold); font-weight:800; letter-spacing:2px; animation:pulse 1s infinite; }
  @keyframes pulse{ 50%{opacity:.5} }
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="score-box"><small>SCORE</small><span class="num" id="scoreNum">0</span><small id="lvInfo" style="color:#ffd76a;font-size:11px;letter-spacing:1px;margin-top:2px"></small></div>
        <div class="stat-right">
          <button class="btn ghost" id="pauseBtn" style="padding:6px 12px;font-size:12px">⏸ 暂停</button>
          <div class="lives" id="lives"></div>
          <div class="bar"><i id="hpFill"></i></div>
        </div>
      </div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="screen">
      <div class="sub">STAR FIGHTER</div>
      <div class="logo">星际战机</div>
      <div class="card">
        <label class="field">飞行员昵称</label>
        <div class="nick-row">
          <input id="nick" maxlength="12" placeholder="输入你的代号…" autocomplete="off">
          <button class="btn dice" id="diceBtn" title="随机昵称">🎲</button>
        </div>
        <button class="btn big" id="startBtn">🚀 开始战斗</button>
      </div>
      <div class="hint">
        <span class="kbd">拖动 / 鼠标</span> 移动战机 · 自动开火<br>
        键盘 <span class="kbd">← →</span> / <span class="kbd">A D</span> 移动 · <span class="kbd">空格</span> 暂停
      </div>
    </div>

    <!-- Pause Screen -->
    <div id="pauseScreen" class="screen hidden">
      <div class="logo" style="font-size:34px">已暂停</div>
      <button class="btn big" id="resumeBtn" style="max-width:220px">继续战斗</button>
      <button class="btn ghost big" id="quitBtn" style="max-width:220px">退出到主菜单</button>
      <div class="hint" style="margin-top:16px">按 <span class="kbd">空格</span> 继续战斗</div>
    </div>

    <!-- Game Over Screen -->
    <div id="overScreen" class="screen hidden">
      <div class="sub" id="overTitle">MISSION FAILED</div>
      <div class="final-score">本局得分<b id="finalScore">0</b><span id="recLabel"></span></div>
      <div class="board">
        <h3>🏆 排行榜 <span class="clear" id="clearBtn">清空</span></h3>
        <ol class="rank" id="rankList"></ol>
      </div>
      <button class="btn big" id="againBtn" style="max-width:300px">🔄 再来一局</button>
      <button class="btn ghost big" id="menuBtn" style="max-width:300px">返回主菜单</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
  // ============ Setup ============
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  let W=480, H=860, DPR=Math.min(window.devicePixelRatio||1, 2);

  function resize(){
    const r = wrap.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildNebula();
  }

  // ============ 性能优化：预渲染发光精灵（替代 shadowBlur） ============
  let glowCache={}, enemyHeavyGrad=null;
  function makeGlow(rgba){
    const s=32, c=document.createElement('canvas'); c.width=c.height=s;
    const g=c.getContext('2d');
    const grad=g.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
    grad.addColorStop(0, rgba);
    grad.addColorStop(0.5, rgba.replace(/[\d.]+\)$/,'0.35)'));
    grad.addColorStop(1, rgba.replace(/[\d.]+\)$/,'0)'));
    g.fillStyle=grad; g.fillRect(0,0,s,s);
    return c;
  }
  function buildSprites(){
    glowCache.cyan  = makeGlow('rgba(34,230,255,0.95)');
    glowCache.gold  = makeGlow('rgba(255,159,59,0.95)');
    glowCache.pink  = makeGlow('rgba(255,84,112,0.95)');
    glowCache.white = makeGlow('rgba(255,255,255,0.95)');
    glowCache.soft  = makeGlow('rgba(200,210,255,0.85)');
    // 重型机体渐变（仅构建一次，避免每帧 createLinearGradient）
    enemyHeavyGrad = ctx.createLinearGradient(0,-28,0,28);
    enemyHeavyGrad.addColorStop(0,'#b06bff'); enemyHeavyGrad.addColorStop(1,'#5a2a9c');
  }

  // 星云预渲染到离屏画布（避免每帧重建渐变）
  let nebCanvas=document.createElement('canvas');
  function buildNebula(){
    nebCanvas.width=W; nebCanvas.height=H;
    const c=nebCanvas.getContext('2d');
    const n1=c.createRadialGradient(W*0.78,H*0.18,10, W*0.78,H*0.18,W*0.8);
    n1.addColorStop(0,'rgba(255,64,160,.20)'); n1.addColorStop(.5,'rgba(190,60,200,.10)'); n1.addColorStop(1,'rgba(255,64,160,0)');
    c.fillStyle=n1; c.fillRect(0,0,W,H);
    const n2=c.createRadialGradient(W*0.16,H*0.80,10, W*0.16,H*0.80,W*0.85);
    n2.addColorStop(0,'rgba(90,80,255,.22)'); n2.addColorStop(.5,'rgba(60,120,255,.10)'); n2.addColorStop(1,'rgba(90,80,255,0)');
    c.fillStyle=n2; c.fillRect(0,0,W,H);
    const n3=c.createRadialGradient(W*0.55,H*0.48,10, W*0.55,H*0.48,W*0.55);
    n3.addColorStop(0,'rgba(40,200,220,.10)'); n3.addColorStop(1,'rgba(40,200,220,0)');
    c.fillStyle=n3; c.fillRect(0,0,W,H);
  }
  window.addEventListener('resize', resize);

  // ============ DOM ============
  const el = id => document.getElementById(id);
  const startScreen=el('startScreen'), overScreen=el('overScreen'), pauseScreen=el('pauseScreen'), hud=el('hud');
  const nickInput=el('nick'), scoreNum=el('scoreNum'), hpFill=el('hpFill'), livesBox=el('lives');

  // ============ Nickname ============
  const NA=['疾风','银翼','暗焰','雷霆','幻影','苍穹','星陨','赤炎','寒鸦','龙渊','夜枭','破晓','烈阳','虚空','钢铁','极光'];
  const NB=['射手','游侠','舰长','猎鹰','先锋','刺客','守望','风暴','骑士','战狼','特工','王牌'];
  const randNick=()=> NA[Math.random()*NA.length|0]+NB[Math.random()*NB.length|0]+(Math.random()*90+10|0);
  el('diceBtn').onclick=()=>{ nickInput.value=randNick(); };
  nickInput.value = randNick();

  // ============ Leaderboard ============
  const LB_KEY='starfighter_leaderboard_v1';
  const loadLB=()=>{ try{ return JSON.parse(localStorage.getItem(LB_KEY))||[] }catch(e){ return [] } };
  const saveLB=(arr)=> localStorage.setItem(LB_KEY, JSON.stringify(arr.slice(0,10)));
  function addScore(name, score){
    const lb=loadLB();
    const entry={name,score,ts:Date.now()};
    lb.push(entry); lb.sort((a,b)=>b.score-a.score);
    const top=lb.slice(0,10); saveLB(top);
    return {rank: top.indexOf(entry), list: top, entry};
  }
  function renderLB(highlightTs){
    const lb=loadLB(); const ol=el('rankList');
    if(!lb.length){ ol.innerHTML='<div class="empty">暂无记录，成为第一名吧！</div>'; return; }
    ol.innerHTML = lb.map((e,i)=>{
      const cls=['','top1','top2','top3'][i+1]||'';
      const me = e.ts===highlightTs ? 'me':'';
      return `<li class="${cls} ${me}"><span class="no">${i+1}</span><span class="nm">${escapeHtml(e.name)}</span><span class="sc">${e.score}</span></li>`;
    }).join('');
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  el('clearBtn').onclick=()=>{ if(confirm('确定清空排行榜？')){ localStorage.removeItem(LB_KEY); renderLB(); } };

  // ============ Game State ============
  const State={ MENU:'menu', PLAY:'play', PAUSE:'pause', OVER:'over' };
  let state=State.MENU;
  let player, bullets, enemies, eBullets, particles, stars, planets, meteors, motes;
  let score, maxHP, hp, lives, tick=0, spawnTimer, difficulty, playerName, invuln, meteorTimer=0;
  let powerups=[], spreadT=0, wingmen=[], wingT=0, lastStream=1, toastT=0, toastText='';
  let level, kills, killQuota, boss, bannerT, won;
  const MAX_LEVEL=10;
  // 分数驱动的难度进度 0→1（24000 分封顶）
  const prog=()=> Math.min((score||0)/24000, 1);

  const STAR_TINTS=['#ffffff','#ffffff','#cfe3ff','#ffe9c7','#ffd0e6','#d7c7ff'];
  function initStars(){
    // 3-layer parallax starfield with twinkle + subtle color
    stars=[];
    for(let i=0;i<160;i++){
      const z=Math.random()*0.85+0.15;
      stars.push({
        x:Math.random()*W, y:Math.random()*H, z,
        r: z*1.1+0.3,
        tint: STAR_TINTS[Math.random()*STAR_TINTS.length|0],
        tw: Math.random()*Math.PI*2,            // twinkle phase
        tws: Math.random()*0.05+0.02            // twinkle speed
      });
    }
    // distant celestial bodies (planets)
    planets=[];
    const pcfg=[
      {cx:W*0.80, cy:H*0.16, r:44, c1:'#ff9ecb', c2:'#7a2e6b', ring:true},
      {cx:W*0.16, cy:H*0.55, r:26, c1:'#9ec9ff', c2:'#26407a', ring:false}
    ];
    for(const p of pcfg){ p.y0=p.cy; p.drift=Math.random()*Math.PI*2; planets.push(p); }
    meteors=[];
    // 精致柔光尘埃粒子（缓慢飘落 + 横向漂移 + 呼吸闪烁）
    motes=[];
    for(let i=0;i<48;i++){
      motes.push({
        x:Math.random()*W, y:Math.random()*H,
        r: Math.random()*1.8+0.6,
        vy: Math.random()*0.35+0.12,
        sway: Math.random()*Math.PI*2, sws: Math.random()*0.02+0.008, amp: Math.random()*0.6+0.2,
        tint: ['#cfe3ff','#ffd9f0','#bda6ff','#a9f0ff'][Math.random()*4|0],
        tw: Math.random()*Math.PI*2, tws: Math.random()*0.04+0.02
      });
    }
  }
  function spawnMeteor(){
    const fromLeft=Math.random()<0.5;
    meteors.push({
      x: fromLeft? -20 : W+20,
      y: Math.random()*H*0.5,
      vx:(fromLeft?1:-1)*(Math.random()*3+4),
      vy: Math.random()*2+2.5,
      life:1, len: Math.random()*40+40
    });
  }
  function resetGame(){
    player={ x:W/2, y:H-120, w:44, h:52, speed:6, cool:0, tx:W/2, ty:H-120 };
    bullets=[]; enemies=[]; eBullets=[]; particles=[]; powerups=[]; spreadT=0; wingmen=[]; wingT=0; lastStream=1; toastT=0;
    score=0; maxHP=100; hp=100; lives=3; tick=0; spawnTimer=0; difficulty=1; invuln=0;
    boss=null; won=false;
    startLevel(1);
    initStars();
    updateHUD();
  }

  // ============ Input ============
  const keys={};
  let pointerDown=false;
  window.addEventListener('keydown',e=>{
    const tag=(e.target&&e.target.tagName)||'';
    const typing=(tag==='INPUT'||tag==='TEXTAREA');
    if(e.code==='Space'){
      if((state===State.PLAY||state===State.PAUSE) && !typing){ e.preventDefault(); togglePause(); }
      return;
    }
    keys[e.key.toLowerCase()]=true;
  });
  window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

  function pointerMove(clientX, clientY){
    const r=canvas.getBoundingClientRect();
    player.tx = clientX - r.left;
    player.ty = clientY - r.top;
  }
  canvas.addEventListener('mousedown',e=>{ pointerDown=true; pointerMove(e.clientX,e.clientY); });
  window.addEventListener('mousemove',e=>{ if(pointerDown&&state===State.PLAY) pointerMove(e.clientX,e.clientY); });
  window.addEventListener('mouseup',()=> pointerDown=false);
  canvas.addEventListener('touchstart',e=>{ pointerDown=true; const t=e.touches[0]; pointerMove(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
  canvas.addEventListener('touchmove',e=>{ if(state===State.PLAY){ const t=e.touches[0]; pointerMove(t.clientX,t.clientY);} e.preventDefault(); },{passive:false});
  canvas.addEventListener('touchend',e=>{ pointerDown=false; e.preventDefault(); },{passive:false});

  // ============ Screen flow ============
  function show(scr){ [startScreen,overScreen,pauseScreen].forEach(s=>s.classList.add('hidden')); if(scr) scr.classList.remove('hidden'); }
  function startGame(){
    playerName = (nickInput.value.trim()||randNick()).slice(0,12);
    resetGame();
    state=State.PLAY; show(null); hud.classList.remove('hidden');
  }
  function togglePause(){
    if(state===State.PLAY){ state=State.PAUSE; show(pauseScreen); }
    else if(state===State.PAUSE){ state=State.PLAY; show(null); }
  }
  function gameOver(){
    state=State.OVER; hud.classList.add('hidden');
    el('overTitle').textContent = won ? '🎉 MISSION COMPLETE · 全关通关' : 'MISSION FAILED · 止步第'+level+'关';
    el('overTitle').style.color = won ? '#ffd76a' : '';
    el('finalScore').textContent=score;
    const {rank}=addScore(playerName, score);
    const ts=loadLB().find(e=>e.name===playerName && e.score===score)?.ts;
    renderLB(ts);
    el('recLabel').innerHTML = rank===0 ? '<span class="newrec">★ 新纪录！榜首 ★</span>' : (rank>=0&&rank<10 ? `<span style="color:#9fb6ff">进入榜单第 ${rank+1} 名</span>`:'');
    show(overScreen);
  }

  el('startBtn').onclick=startGame;
  el('againBtn').onclick=startGame;
  el('menuBtn').onclick=()=>{ state=State.MENU; show(startScreen); };
  el('quitBtn').onclick=()=>{ state=State.MENU; hud.classList.add('hidden'); show(startScreen); };
  el('resumeBtn').onclick=togglePause;
  el('pauseBtn').onclick=togglePause;
  nickInput.addEventListener('keydown',e=>{ if(e.key==='Enter') startGame(); });

  // ============ HUD ============
  function updateHUD(){
    scoreNum.textContent=score;
    el('lvInfo').textContent = boss ? ('第 '+level+' 关 · BOSS 战') : ('第 '+level+' 关 · 🔥'+streamLevel()+'束');
    hpFill.style.width=Math.max(0,hp/maxHP*100)+'%';
    livesBox.innerHTML = Array.from({length:lives}).map(()=>lifeSVG()).join('');
  }
  const lifeSVG=()=>'<svg class="life" viewBox="0 0 24 24"><path fill="#ff4d6d" d="M12 3l3 7 7 .6-5.3 4.6 1.7 6.8L12 18.6 5.9 22l1.7-6.8L2.3 10.6 9.3 10z"/></svg>';

  // ============ Entities ============
  // 基础火力束数：随分数成长，1→2→3 束
  function streamLevel(){ return score>=10000 ? 3 : score>=4000 ? 2 : 1; }
  function showToast(t){ toastT=90; toastText=t; }
  function fireBullet(){
    const sl=streamLevel();
    if(sl===1){ // 1 束：中间单条竖直弹流
      bullets.push({x:player.x, y:player.y-24, w:5, h:18, vy:-8, dmg:32});
    } else if(sl===2){ // 2 束：左右平行两列
      bullets.push({x:player.x-18, y:player.y-22, w:4, h:16, vy:-8, dmg:28});
      bullets.push({x:player.x+18, y:player.y-22, w:4, h:16, vy:-8, dmg:28});
    } else { // 3 束：左·中·右平行三列
      bullets.push({x:player.x-30, y:player.y-18, w:4, h:14, vy:-8, dmg:24});
      bullets.push({x:player.x,     y:player.y-24, w:5, h:18, vy:-8, dmg:30});
      bullets.push({x:player.x+30, y:player.y-18, w:4, h:14, vy:-8, dmg:24});
    }
    if(spreadT>0){ // 限时「子弹束」道具：额外两列平行弹
      bullets.push({x:player.x-46, y:player.y-18, w:4, h:14, vy:-8, dmg:20});
      bullets.push({x:player.x+46, y:player.y-18, w:4, h:14, vy:-8, dmg:20});
    }
  }
  function spawnEnemy(){
    const t=Math.random(), p=prog(), spd=1+p*1.2;   // 移速倍率 1.0→2.2
    const cd=1-p*0.6;                                // 射击冷却倍率 1.0→0.4
    let e;
    if(t<0.62){ // scout
      e={type:'scout', x:Math.random()*(W-60)+30, y:-40, w:38, h:38, hp:55, maxhp:55, vy:1.4*spd, vx:0, score:100, cool:9999};
    } else if(t<0.9){ // fighter (shoots)
      e={type:'fighter', x:Math.random()*(W-70)+35, y:-50, w:46, h:44, hp:120, maxhp:120, vy:1.0*spd, vx:(Math.random()<.5?-1:1)*0.8, score:250, cool:100*cd|0};
    } else { // heavy
      e={type:'heavy', x:Math.random()*(W-90)+45, y:-70, w:64, h:60, hp:280, maxhp:280, vy:0.8*spd, vx:0, score:600, cool:130*cd|0};
    }
    enemies.push(e);
  }
  function enemyShoot(e){
    const bs=1+prog()*0.9;  // 子弹速度倍率 1.0→1.9
    if(e.type==='fighter'){
      eBullets.push({x:e.x, y:e.y+e.h/2, w:6, h:14, vy:2.3*bs, vx:0, dmg:18});
    } else if(e.type==='heavy'){
      for(let a=-1;a<=1;a++) eBullets.push({x:e.x, y:e.y+e.h/2, w:7, h:14, vy:2.0*bs, vx:a*1.1, dmg:22});
    }
  }
  function explode(x,y,color,n=18,spd=4){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=Math.random()*spd+1;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,r:Math.random()*3+1.5});
    }
  }

  // ============ 道具掉落 ============
  const PU={
    bomb:  {color:'#ff5470', label:'✸'},
    heal:  {color:'#54ff9f', label:'+'},
    spread:{color:'#22e6ff', label:'≡'},
    wing:  {color:'#ffd76a', label:'✦'},
    life:  {color:'#ff6a8a', label:'♥'}
  };
  const MAX_LIVES=6;   // 生命条数上限
  function spawnPowerup(x,y, force){
    let t=force;
    if(!t){
      const r=Math.random();
      // 五种奖励：加血 / 全屏清敌 / 子弹束 / 僚机 / 加命
      t = r<0.28 ? 'heal' : r<0.50 ? 'bomb' : r<0.68 ? 'spread' : r<0.82 ? 'wing' : 'life';
    }
    powerups.push({x, y, vy:1.7, type:t, r:14, t:0});
  }
  function applyPowerup(p){
    if(p.type==='heal'){
      hp=Math.min(maxHP, hp+30); updateHUD(); showToast('+30 HP');
    } else if(p.type==='bomb'){
      for(const e of enemies){ score+=e.score; explode(e.x,e.y,'#ff9f45',18,5); }
      enemies.length=0; eBullets.length=0; updateHUD(); showToast('全屏清敌！');
    } else if(p.type==='spread'){
      spreadT=720; showToast('子弹束 · 散射 12s');
    } else if(p.type==='wing'){
      if(wingmen.length<2) wingmen.push({side: wingmen.length===0?-1:1, cool:0});
      wingT=Math.max(wingT, 720); showToast('僚机出击 12s');
    } else if(p.type==='life'){
      if(lives<MAX_LIVES){ lives++; updateHUD(); showToast('❤ 生命 +1 ('+lives+'/'+MAX_LIVES+')'); }
      else { hp=Math.min(maxHP, hp+30); updateHUD(); showToast('生命已满 +30 HP'); }
    }
    explode(player.x, player.y, '#ffffff', 10, 3);
  }

  // ============ Levels & Boss ============
  const BOSS_NAMES=['深红巡洋舰','虚空要塞','暗影母舰'];
  function startLevel(n){
    level=n; kills=0; killQuota=14+n*4; boss=null; bannerT=130;
  }
  function spawnBoss(){
    const arch=(level-1)%3; // 0巡洋舰 1要塞 2母舰
    const hp = 2400 + level*1300 + level*level*80;   // L1≈3780 L5≈10900 L10≈23400
    boss={
      arch, name:BOSS_NAMES[arch]+' Lv.'+level,
      x:W/2, y:-100, w:160, h:104,
      hp, maxhp:hp,
      cool:90, minionCool:300, phase:0,
      bSpd:2.2+level*0.16, entering:true,
      score:1500+level*500,
      rings:[], flash:0, phaseRot:0, spiral:0,
      dropCool:300  // Boss 战中周期性随机掉落奖励
    };
    updateHUD();
  }
  function enterBossPhase(p){
    boss.phase=p; boss.cool=Math.max(18,boss.cool); boss.flash=26;
    boss.rings.push({r:24,life:1});
  }
  function bossShoot(){
    const b=boss, s=b.bSpd*(1+b.phase*0.12);
    if(b.arch===0){ // 巡洋舰：瞄准散射
      const a=Math.atan2(player.y-b.y, player.x-b.x);
      const spread = b.phase>=1 ? 5 : 3;
      for(let k=-((spread-1)/2);k<=((spread-1)/2);k++){
        const ang=a+k*0.16;
        eBullets.push({x:b.x, y:b.y+30, w:8, h:8, vx:Math.cos(ang)*s, vy:Math.sin(ang)*s, dmg:18, round:true});
      }
      if(b.phase>=2){ // 狂暴：附加螺旋弹
        const off=(b.spiral+=0.5);
        for(let i=0;i<4;i++){ const an=off+i*Math.PI/2; eBullets.push({x:b.x,y:b.y+10,w:7,h:7,vx:Math.cos(an)*s*0.7,vy:Math.sin(an)*s*0.7,dmg:16,round:true}); }
      }
    } else if(b.arch===1){ // 要塞：环形弹幕（随阶段加密 / 反向环）
      const n=(10+Math.min(10,level)) + b.phase*4;
      b.phaseRot+=0.35;
      const off=b.phaseRot;
      for(let i=0;i<n;i++){ const ang=off+i/n*Math.PI*2; eBullets.push({x:b.x,y:b.y+10,w:7,h:7,vx:Math.cos(ang)*s*0.8,vy:Math.sin(ang)*s*0.8,dmg:16,round:true}); }
      if(b.phase>=2){ // 反向环
        for(let i=0;i<n;i++){ const ang=-off+i/n*Math.PI*2; eBullets.push({x:b.x,y:b.y+10,w:6,h:6,vx:Math.cos(ang)*s*0.6,vy:Math.sin(ang)*s*0.6,dmg:15,round:true}); }
      }
    } else { // 母舰：扇形弹 + 螺旋（狂暴更密更快）
      const n=5+Math.min(5,(level/2|0)) + b.phase*2;
      for(let i=0;i<n;i++){ const ang=Math.PI/2+(i-(n-1)/2)*0.22; eBullets.push({x:b.x,y:b.y+34,w:8,h:8,vx:Math.cos(ang)*s,vy:Math.sin(ang)*s,dmg:18,round:true}); }
      if(b.phase>=1){ // 螺旋弹
        b.spiral+=0.4;
        for(let i=0;i<3;i++){ const ang=b.spiral+i*2*Math.PI/3; eBullets.push({x:b.x,y:b.y,w:7,h:7,vx:Math.cos(ang)*s*0.9,vy:Math.sin(ang)*s*0.9,dmg:16,round:true}); }
      }
    }
  }
  function updateBoss(){
    const b=boss;
    if(b.entering){ b.y+=2; if(b.y>=150) b.entering=false; return; }
    // 阶段切换（66% / 33%）
    const frac=b.hp/b.maxhp;
    if(b.phase===0 && frac<=0.66) enterBossPhase(1);
    else if(b.phase===1 && frac<=0.33) enterBossPhase(2);
    // 移动
    b.x = W/2 + Math.sin(tick*0.012)*(W/2-100);
    // Boss 战中随机掉落奖励（阶段越高越频繁）
    b.dropCool--;
    if(b.dropCool<=0){ spawnPowerup(b.x + (Math.random()*40-20), b.y+40); b.dropCool = Math.max(180, 360 - b.phase*60); }
    // 冲击波环 / 闪光衰减
    for(let i=b.rings.length-1;i>=0;i--){ const r=b.rings[i]; r.r+=5; r.life-=0.03; if(r.life<=0) b.rings.splice(i,1); }
    if(b.flash>0) b.flash--;
    // 射击（阶段越高越快）
    b.cool--;
    if(b.cool<=0){ bossShoot(); b.cool=Math.max(26, 84-level*4) - b.phase*10; }
    // 母舰召唤小兵（阶段越高越频繁）
    if(b.arch===2){
      b.minionCool--;
      if(b.minionCool<=0 && enemies.length<4+b.phase){
        enemies.push({type:'scout', x:b.x+(Math.random()<.5?-70:70), y:b.y+40, w:38, h:38, hp:55, maxhp:55, vy:1.6, vx:0, score:100, cool:9999});
        b.minionCool=Math.max(120, 240-level*10 - b.phase*30);
      }
    }
    // 玩家子弹打 Boss
    for(let j=bullets.length-1;j>=0;j--){
      const bl=bullets[j];
      if(Math.abs(bl.x-b.x)<b.w/2 && Math.abs(bl.y-b.y)<b.h/2){
        b.hp-=bl.dmg; bullets.splice(j,1);
        explode(bl.x,bl.y,'#ffd76a',4,2.5);
      }
    }
    // 撞击玩家
    if(invuln<=0 && Math.abs(b.x-player.x)<(b.w/2+14) && Math.abs(b.y-player.y)<(b.h/2+16)) hitPlayer(45);
    // Boss 死亡 → 过关
    if(b.hp<=0){
      score+=b.score;
      for(let i=0;i<6;i++) explode(b.x+(Math.random()-.5)*b.w, b.y+(Math.random()-.5)*b.h, ['#ffb14d','#ff6a8a','#ffd76a','#c05cff'][i%4], 26, 6);
      spawnPowerup(b.x, b.y, Math.random()<0.3?'heal':Math.random()<0.5?'spread':Math.random()<0.7?'wing':'life');
      boss=null; updateHUD();
      if(level>=MAX_LEVEL){ won=true; gameOver(); }
      else startLevel(level+1);
    }
  }

  // ============ Update ============
  function update(){
    tick++;
    difficulty = 1 + prog()*1.2;   // 仅由分数驱动（星空滚动等沿用）
    if(bannerT>0) bannerT--;
    if(toastT>0) toastT--;
    const sl=streamLevel();
    if(sl>lastStream){ lastStream=sl; showToast('🔥 火力提升至 '+sl+' 束'); }

    // space background (stars + meteors)
    updateSpace();

    // player movement（键盘灵敏度下调，避免一按就窜太远）
    // 键盘：直接驱动位置（无惯性、松手即停），便于精准微操
    const kL=keys['arrowleft']||keys['a'], kR=keys['arrowright']||keys['d'],
          kU=keys['arrowup']||keys['w'], kD=keys['arrowdown']||keys['s'];
    if(kL||kR||kU||kD){
      const step=3.4, dx=(kR?1:0)-(kL?1:0), dy=(kD?1:0)-(kU?1:0), len=Math.hypot(dx,dy)||1;
      player.x+=dx/len*step; player.y+=dy/len*step;
      player.x=Math.max(24,Math.min(W-24,player.x));
      player.y=Math.max(60,Math.min(H-30,player.y));
      player.tx=player.x; player.ty=player.y;   // 同步，松开后不回弹
    } else {
      // 鼠标/触摸：平滑跟随
      player.x+=(player.tx-player.x)*0.25;
      player.y+=(player.ty-player.y)*0.25;
    }

    // auto fire（射速随分数提升：14帧/发 → 7帧/发）
    if(player.cool<=0){ fireBullet(); player.cool=Math.round(14-prog()*7); } else player.cool--;
    if(invuln>0) invuln--;

    // bullets
    for(let i=bullets.length-1;i>=0;i--){ const b=bullets[i]; b.y+=b.vy; b.x+=(b.vx||0); if(b.y<-20||b.x<-20||b.x>W+20) bullets.splice(i,1); }

    // 道具掉落：限时增益衰减 + 拾取 + 僚机开火
    if(spreadT>0) spreadT--;
    if(wingT>0){ wingT--; if(wingT<=0) wingmen.length=0; }
    for(let i=powerups.length-1;i>=0;i--){
      const p=powerups[i]; p.y+=p.vy; p.t+=0.1;
      if(p.y>H+20){ powerups.splice(i,1); continue; }
      if(Math.abs(p.x-player.x)<20 && Math.abs(p.y-player.y)<24){
        applyPowerup(p); powerups.splice(i,1);
      }
    }
    for(const w of wingmen){
      w.cool--;
      if(w.cool<=0){
        bullets.push({x:player.x + w.side*38, y:player.y+6, w:4, h:14, vy:-7, dmg:22, wing:true});
        w.cool=12;
      }
    }

    // spawn / 关卡推进
    if(boss){
      updateBoss();
    } else if(kills>=killQuota){
      if(enemies.length===0) spawnBoss();   // 清完场再出 Boss
    } else {
      spawnTimer--;
      if(spawnTimer<=0){ spawnEnemy(); spawnTimer=Math.max(28, Math.round(90-prog()*60)); }
    }

    // enemies
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      e.y+=e.vy; e.x+=e.vx;
      if(e.x<e.w/2||e.x>W-e.w/2) e.vx*=-1;
      e.cool--; if(e.cool<=0 && e.type!=='scout'){ enemyShoot(e); e.cool = Math.round((e.type==='heavy'?150:120)*(1-prog()*0.6)); }
      if(e.y>H+60){ enemies.splice(i,1); continue; }
      // bullet hits
      for(let j=bullets.length-1;j>=0;j--){
        const b=bullets[j];
        if(Math.abs(b.x-e.x)<e.w/2 && Math.abs(b.y-e.y)<e.h/2){
          e.hp-=b.dmg; bullets.splice(j,1);
          explode(b.x,b.y,'#9fe8ff',5,3);
          if(e.hp<=0){
            score+=e.score; kills++;
            explode(e.x,e.y, e.type==='heavy'?'#ffb14d':'#ff6a8a', e.type==='heavy'?34:20, 5);
            if(Math.random()<0.10) spawnPowerup(e.x, e.y);
            enemies.splice(i,1); updateHUD(); break;
          }
        }
      }
      // enemy touches player
      if(state===State.PLAY && invuln<=0 && Math.abs(e.x-player.x)<(e.w/2+16) && Math.abs(e.y-player.y)<(e.h/2+18)){
        enemies.splice(i,1); explode(e.x,e.y,'#ff6a8a',18,4); hitPlayer(34);
      }
    }

    // enemy bullets
    for(let i=eBullets.length-1;i>=0;i--){
      const b=eBullets[i]; b.y+=b.vy; b.x+=b.vx||0;
      if(b.y>H+20||b.y<-30||b.x<-20||b.x>W+20){ eBullets.splice(i,1); continue; }
      if(state===State.PLAY && invuln<=0 && Math.abs(b.x-player.x)<16 && Math.abs(b.y-player.y)<18){
        eBullets.splice(i,1); hitPlayer(b.dmg);
      }
    }

    // particles
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.life-=0.03;
      if(p.life<=0) particles.splice(i,1);
    }
  }
  function hitPlayer(dmg){
    hp-=dmg; invuln=60;
    explode(player.x,player.y,'#ff4d6d',16,4);
    if(hp<=0){
      lives--;
      if(lives<=0){ updateHUD(); gameOver(); return; }
      hp=maxHP;
    }
    updateHUD();
  }

  // ============ Draw ============
  function drawSpace(){
    // deep-space base wash
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0a0620'); bg.addColorStop(.5,'#070417'); bg.addColorStop(1,'#04020d');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    // 预渲染星云（每帧仅 drawImage 一次，避免重建渐变）
    if(nebCanvas.width) ctx.drawImage(nebCanvas,0,0,W,H);

    // distant planets
    if(planets) for(const p of planets){
      const py = p.y0 + Math.sin(tick*0.0008 + p.drift)*6;
      if(p.ring){
        ctx.save(); ctx.translate(p.cx,py); ctx.rotate(-0.5);
        ctx.strokeStyle='rgba(255,200,230,.12)'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.ellipse(0,0,p.r*1.7,p.r*0.55,0,0,7); ctx.stroke();
        ctx.restore();
      }
      const g=ctx.createRadialGradient(p.cx-p.r*0.35, py-p.r*0.35, p.r*0.2, p.cx, py, p.r);
      g.addColorStop(0,p.c1); g.addColorStop(1,p.c2);
      ctx.globalAlpha=0.40; ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(p.cx,py,p.r,0,7); ctx.fill();
      ctx.globalAlpha=1;
    }

    // twinkling parallax stars
    for(const s of stars){
      s.tw += s.tws;
      const tw = 0.55 + Math.sin(s.tw)*0.45;
      if(s.z>0.75){ // 亮星用预渲染光晕精灵（极廉价）
        const a=s.z*tw;
        ctx.globalAlpha=Math.min(1,a);
        const r=s.r*3.4;
        ctx.drawImage(glowCache.soft, s.x-r, s.y-r, r*2, r*2);
      } else {
        ctx.globalAlpha = s.z*tw;
        ctx.fillStyle = s.tint;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
      }
    }
    ctx.globalAlpha=1;

    // 精致柔光尘埃粒子（前景漂浮，降低亮度避免干扰操作）
    if(motes) for(const m of motes){
      m.tw+=m.tws;
      const tw=0.45+Math.sin(m.tw)*0.55;
      ctx.globalAlpha=0.10+0.22*tw;
      const r=m.r*3.2;
      ctx.drawImage(glowCache.soft, m.x-r, m.y-r, r*2, r*2);
    }
    ctx.globalAlpha=1;

    // shooting stars / meteors
    if(meteors) for(const m of meteors){
      ctx.globalAlpha=Math.max(0,m.life);
      const g=ctx.createLinearGradient(m.x,m.y, m.x-m.vx/ (Math.hypot(m.vx,m.vy))*m.len, m.y-m.vy/(Math.hypot(m.vx,m.vy))*m.len);
      g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle=g; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(m.x,m.y);
      const inv=m.len/Math.hypot(m.vx,m.vy);
      ctx.lineTo(m.x-m.vx*inv, m.y-m.vy*inv); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  function updateSpace(){
    // parallax scroll by depth
    for(const s of stars){ s.y += s.z*2.4*(1+ (difficulty?difficulty:1)*0.04); if(s.y>H){ s.y=-2; s.x=Math.random()*W; } }
    // meteors
    meteorTimer--;
    if(meteorTimer<=0){ if(Math.random()<0.6) spawnMeteor(); meteorTimer=90+Math.random()*140|0; }
    if(meteors) for(let i=meteors.length-1;i>=0;i--){ const m=meteors[i]; m.x+=m.vx; m.y+=m.vy; m.life-=0.012; if(m.life<=0||m.y>H+30||m.x<-40||m.x>W+40) meteors.splice(i,1); }
    if(motes) for(const m of motes){
      m.y+=m.vy; m.sway+=m.sws; m.x+=Math.sin(m.sway)*m.amp*0.3;
      if(m.y>H+4){ m.y=-4; m.x=Math.random()*W; }
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    drawSpace();

    // particles
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;

    // enemy bullets（粉红光晕精灵 + 亮核）
    for(const b of eBullets){
      const r=Math.max(b.w,b.h)*1.7;
      ctx.globalAlpha=0.8; ctx.drawImage(glowCache.pink, b.x-r, b.y-r, r*2, r*2);
      ctx.globalAlpha=1; ctx.fillStyle='#ff8aa3';
      ctx.beginPath(); ctx.ellipse(b.x,b.y,b.w/2,b.h/2,0,0,7); ctx.fill();
    }

    // player bullets（主机：青色光束；僚机：金色椭圆，明显区分）
    for(const b of bullets){
      if(b.wing){
        const r=Math.max(b.w,b.h)*1.7;
        ctx.globalAlpha=0.8; ctx.drawImage(glowCache.gold, b.x-r, b.y-r, r*2, r*2);
        ctx.globalAlpha=1; ctx.fillStyle='#ffe1a3';
        ctx.beginPath(); ctx.ellipse(b.x, b.y, b.w/2, b.h/2, 0, 0, 7); ctx.fill();
      } else {
        const r=b.w*1.8;
        ctx.globalAlpha=0.75; ctx.drawImage(glowCache.cyan, b.x-r, b.y-b.h*0.6, r*2, b.h*1.2+r*2);
        ctx.globalAlpha=1; ctx.fillStyle='#d6fbff';
        ctx.fillRect(b.x-b.w/2, b.y, b.w, b.h);
      }
    }

    // enemies
    for(const e of enemies) drawEnemy(e);
    if(boss) drawBoss();
    drawPowerups();

    // wingmen behind player
    drawWingmen();

    // player
    if(state===State.PLAY||state===State.PAUSE) drawPlayer();

    // 限时增益倒计时图标
    if(state===State.PLAY||state===State.PAUSE) drawBuffs();

    // 中央提示文字（火力提升 / 拾取道具）
    if(toastT>0 && (state===State.PLAY)){
      ctx.globalAlpha=Math.min(1, toastT/30);
      ctx.textAlign='center'; ctx.font='800 22px "Segoe UI","PingFang SC",sans-serif';
      ctx.fillStyle='#ffd76a'; ctx.shadowColor='#ffd76a'; ctx.shadowBlur=18;
      ctx.fillText(toastText, W/2, H*0.30);
      ctx.shadowBlur=0; ctx.globalAlpha=1;
    }

    // 关卡横幅
    if(bannerT>0 && (state===State.PLAY)){
      const a=Math.min(1, bannerT/40);
      ctx.globalAlpha=a; ctx.textAlign='center';
      ctx.font='900 40px "Segoe UI","PingFang SC",sans-serif';
      ctx.fillStyle='#ffd76a'; ctx.shadowColor='#ffd76a'; ctx.shadowBlur=24;
      ctx.fillText('第 '+level+' 关', W/2, H*0.4);
      ctx.font='13px sans-serif'; ctx.shadowBlur=0; ctx.fillStyle='#c8b8ff';
      ctx.fillText('警戒 · 敌军来袭', W/2, H*0.4+30);
      ctx.globalAlpha=1;
    }
  }

  function drawBoss(){
    const b=boss;
    ctx.save(); ctx.translate(b.x,b.y);
    // 阶段冲击波环
    for(const r of b.rings){
      ctx.globalAlpha=r.life*0.8; ctx.strokeStyle='#ffe08a'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(0,0,r.r,0,7); ctx.stroke();
    }
    ctx.globalAlpha=1;
    const cs=['#ff4d6d','#c05cff','#ff9f45'][b.arch];
    const enrage = b.phase>=2;
    ctx.shadowColor=cs; ctx.shadowBlur=enrage?40:26;
    const g=ctx.createLinearGradient(0,-b.h/2,0,b.h/2);
    g.addColorStop(0,'#3a3355'); g.addColorStop(.55, enrage?'#ff2e55':cs); g.addColorStop(1,'#17102b');
    ctx.fillStyle = b.flash>0 ? '#ffffff' : g;
    // ---- 舰体（按原型绘制不同造型，彻底告别五边形）----
    if(b.arch===0){
      // 巡洋舰：前掠三角翼，尖首朝下（敏捷突击舰）
      ctx.beginPath();
      ctx.moveTo(0, b.h/2);
      ctx.lineTo(-b.w/2, b.h/2*0.35);
      ctx.lineTo(-b.w*0.42, -b.h/2);
      ctx.lineTo(-b.w*0.16, -b.h/2*0.55);
      ctx.lineTo(0, b.h/2*0.5);
      ctx.lineTo(b.w*0.16, -b.h/2*0.55);
      ctx.lineTo(b.w*0.42, -b.h/2);
      ctx.lineTo(b.w/2, b.h/2*0.35);
      ctx.closePath(); ctx.fill();
      if(b.flash<=0){ // 脊线高光
        ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(0,b.h/2); ctx.lineTo(0,-b.h/2*0.6); ctx.stroke();
      }
    } else if(b.arch===1){
      // 要塞：宽厚六边形装甲堡垒
      ctx.beginPath();
      ctx.moveTo(-b.w/2, b.h/2*0.1);
      ctx.lineTo(-b.w/3, -b.h/2);
      ctx.lineTo(b.w/3, -b.h/2);
      ctx.lineTo(b.w/2, b.h/2*0.1);
      ctx.lineTo(b.w/3, b.h/2);
      ctx.lineTo(-b.w/3, b.h/2);
      ctx.closePath(); ctx.fill();
      if(b.flash<=0){ // 装甲板细节
        ctx.fillStyle='rgba(0,0,0,.25)';
        ctx.fillRect(-b.w/2*0.72,-b.h/2*0.5,b.w*0.5,b.h*0.5);
        ctx.fillRect(b.w/2*0.22,-b.h/2*0.5,b.w*0.5,b.h*0.5);
      }
    } else {
      // 母舰：椭圆飞碟 + 中央穹顶 + 下舰体
      ctx.beginPath(); ctx.ellipse(0, b.h*0.05, b.w/2, b.h/2*0.6, 0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, b.h*0.22, b.w*0.34, b.h*0.22, 0,0,Math.PI*2); ctx.fill();
      if(b.flash<=0){ // 中央穹顶（更亮）
        ctx.fillStyle='rgba(255,255,255,.18)';
        ctx.beginPath(); ctx.ellipse(0,-b.h*0.16, b.w*0.22, b.h*0.16, 0,0,Math.PI*2); ctx.fill();
      }
    }
    ctx.shadowBlur=0;
    // 核心（发光）
    const pulse=6+Math.sin(tick*0.15)*3;
    ctx.fillStyle=enrage?'#ffd0d0':'#fff'; ctx.shadowColor=enrage?'#ff5b7a':'#fff'; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.arc(0, b.arch===2?-b.h*0.02:(b.arch===1?0:6), pulse, 0, 7); ctx.fill();
    ctx.shadowBlur=0;
    // 侧炮 / 炮塔（按造型）
    if(b.arch===1){
      ctx.fillStyle='rgba(255,255,255,.28)';   // 要塞：四角炮塔
      ctx.fillRect(-b.w/2+4,-b.h/2*0.25,16,16);
      ctx.fillRect(b.w/2-20,-b.h/2*0.25,16,16);
      ctx.fillRect(-b.w/2+4,b.h/2*0.3,16,16);
      ctx.fillRect(b.w/2-20,b.h/2*0.3,16,16);
    } else {
      ctx.fillStyle='rgba(255,255,255,.25)';   // 巡洋舰 / 母舰：双侧炮
      ctx.fillRect(-b.w/2+8,-6,14,22); ctx.fillRect(b.w/2-22,-6,14,22);
    }
    ctx.restore();
    // 顶部 Boss 血条 + 阶段标记
    const bw=W-80;
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(40,54,bw,10);
    const grd=ctx.createLinearGradient(40,0,40+bw,0);
    grd.addColorStop(0, enrage?'#ff2e55':'#ff4d6d'); grd.addColorStop(1,'#ffb14d');
    ctx.fillStyle=grd; ctx.fillRect(40,54,bw*Math.max(0,b.hp/b.maxhp),10);
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.strokeRect(40,54,bw,10);
    // 阶段刻度线 (66% / 33%)
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(40+bw*0.66,54); ctx.lineTo(40+bw*0.66,64); ctx.moveTo(40+bw*0.33,54); ctx.lineTo(40+bw*0.33,64); ctx.stroke();
    ctx.textAlign='center'; ctx.font='700 12px sans-serif'; ctx.fillStyle=enrage?'#ff8da3':'#ffd0da';
    ctx.fillText(b.name + (b.phase>0?('  · PHASE '+(b.phase+1)):''), W/2, 50);
  }

  function drawPowerups(){
    for(const p of powerups){
      const cfg=PU[p.type], bob=Math.sin(p.t)*2;
      ctx.save(); ctx.translate(p.x, p.y+bob);
      ctx.shadowColor=cfg.color; ctx.shadowBlur=16;
      ctx.globalAlpha=0.92; ctx.fillStyle=cfg.color;
      ctx.beginPath(); ctx.arc(0,0,p.r,0,7); ctx.fill();
      ctx.globalAlpha=1; ctx.shadowBlur=0;
      ctx.fillStyle='#160c28'; ctx.font='900 16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(cfg.label, 0, 1);
      ctx.restore();
    }
    ctx.textBaseline='alphabetic';
  }
  function drawWingmen(){
    for(const w of wingmen){
      const wx=player.x + w.side*38;
      ctx.save(); ctx.translate(wx, player.y+10);
      ctx.shadowColor='#ffd76a'; ctx.shadowBlur=12; ctx.fillStyle='#cab8ff';
      ctx.beginPath(); ctx.moveTo(0,-13); ctx.lineTo(-9,8); ctx.lineTo(9,8); ctx.closePath(); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-2,3,0,7); ctx.fill();
      ctx.restore();
    }
  }
  function drawBuffIcon(x,y,color,label,frac){
    ctx.fillStyle='rgba(0,0,0,.42)'; ctx.fillRect(x,y,38,38);
    ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.strokeRect(x,y,38,38);
    ctx.fillStyle=color; ctx.font='900 18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label, x+19, y+15);
    ctx.fillStyle=color; ctx.fillRect(x, y+34, 38*Math.max(0,frac), 4);
    ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  }
  function drawBuffs(){
    let x=14, y=H-58;
    if(spreadT>0){ drawBuffIcon(x,y,'#22e6ff','≡', spreadT/720); x+=44; }
    if(wingT>0){ drawBuffIcon(x,y,'#ffd76a','✦', wingT/720); }
  }

  function drawPlayer(){
    const {x,y}=player;
    ctx.save(); ctx.translate(x,y);
    if(invuln>0 && (tick>>2)&1) ctx.globalAlpha=0.4;
    // engine flames
    const f=6+Math.sin(tick*0.6)*4;
    const grd=ctx.createLinearGradient(0,18,0,40+f);
    grd.addColorStop(0,'#fff'); grd.addColorStop(.4,'#ffd76a'); grd.addColorStop(1,'rgba(255,90,60,0)');
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.moveTo(-7,16); ctx.lineTo(0,40+f); ctx.lineTo(7,16); ctx.closePath(); ctx.fill();
    // body glow
    ctx.shadowColor='#22e6ff'; ctx.shadowBlur=16;
    // wings
    ctx.fillStyle='#2b57c9';
    ctx.beginPath();
    ctx.moveTo(0,-6); ctx.lineTo(-24,14); ctx.lineTo(-8,10); ctx.lineTo(0,4); ctx.lineTo(8,10); ctx.lineTo(24,14); ctx.closePath(); ctx.fill();
    // fuselage
    const bg=ctx.createLinearGradient(0,-26,0,20);
    bg.addColorStop(0,'#eaf6ff'); bg.addColorStop(.5,'#7fb0ff'); bg.addColorStop(1,'#2b57c9');
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.moveTo(0,-26); ctx.lineTo(9,2); ctx.lineTo(6,18); ctx.lineTo(-6,18); ctx.lineTo(-9,2); ctx.closePath(); ctx.fill();
    // cockpit
    ctx.shadowBlur=0;
    ctx.fillStyle='#0affff';
    ctx.beginPath(); ctx.ellipse(0,-8,4,7,0,0,7); ctx.fill();
    ctx.restore();
  }

  function drawEnemy(e){
    ctx.save(); ctx.translate(e.x,e.y);
    if(e.type==='scout'){
      ctx.drawImage(glowCache.pink, -18, -18, 36, 36);
      ctx.fillStyle='#ff5470';
      ctx.beginPath(); ctx.moveTo(0,18); ctx.lineTo(-16,-14); ctx.lineTo(0,-6); ctx.lineTo(16,-14); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffd0da'; ctx.beginPath(); ctx.arc(0,2,4,0,7); ctx.fill();
    } else if(e.type==='fighter'){
      ctx.drawImage(glowCache.gold, -24, -22, 48, 48);
      ctx.fillStyle='#ff8a3d';
      ctx.beginPath();
      ctx.moveTo(0,22); ctx.lineTo(-22,0); ctx.lineTo(-8,-6); ctx.lineTo(0,-16); ctx.lineTo(8,-6); ctx.lineTo(22,0); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#fff3b0'; ctx.beginPath(); ctx.ellipse(0,0,5,7,0,0,7); ctx.fill();
    } else {
      ctx.drawImage(glowCache.soft, -32, -32, 64, 64);
      ctx.fillStyle=enemyHeavyGrad;
      ctx.beginPath();
      ctx.moveTo(0,28); ctx.lineTo(-30,10); ctx.lineTo(-20,-14); ctx.lineTo(0,-24); ctx.lineTo(20,-14); ctx.lineTo(30,10); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffe14d'; ctx.beginPath(); ctx.arc(0,-2,6,0,7); ctx.fill();
    }
    // hp bar for tougher
    if(e.maxhp>40 && e.hp<e.maxhp){
      ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(-e.w/2,-e.h/2-8,e.w,4);
      ctx.fillStyle='#3affa3'; ctx.fillRect(-e.w/2,-e.h/2-8,e.w*(e.hp/e.maxhp),4);
    }
    ctx.restore();
  }

  // ============ Loop ============
  function loop(){
    if(state===State.PLAY){ update(); draw(); }
    else if(state===State.PAUSE||state===State.OVER){ draw(); }
    else { // menu / boot: idle deep-space
      if(!stars) initStars();
      tick++;
      updateSpace();
      ctx.clearRect(0,0,W,H);
      drawSpace();
    }
    requestAnimationFrame(loop);
  }

  // ============ Boot ============
  buildSprites(); resize(); initStars(); show(startScreen); loop();
})();
</script>
</body>
