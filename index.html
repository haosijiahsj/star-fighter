  // ============ 过场动画：黑洞跳跃（WARP 状态） ============
  function newStreak(){                 // 一条从屏幕边缘飞向黑洞的吸入条纹
    const edge=Math.random(); let x,y;
    if(edge<0.5){ x=Math.random()*W; y=-20; }
    else { x=Math.random()<0.5?-20:W+20; y=Math.random()*H*0.5; }
    return { x, y };
  }
  function startWarp(){
    state=State.WARP;
    warpT=0; warpParts=[]; warpStreaks=[];
    if(warpMode!=='boss'){ hx=W/2; hy=H*0.20; }   // 正常跃迁：黑洞在上方；Boss 塌缩：hx/hy 已由 boss 死亡处设定
    hud.classList.add('hidden'); warpSkip.classList.remove('hidden');
    for(let i=0;i<46;i++) warpParts.push({ a:Math.random()*Math.PI*2, r:30+Math.random()*120, sp:0.02+Math.random()*0.05, sz:1+Math.random()*2.2 });
    for(let i=0;i<22;i++) warpStreaks.push(newStreak());
  }
  function updateWarp(){
    tick++;
    warpT++;
    const T=(warpMode==='boss')?WARP_BOSS:WARP;   // 当前模式的时序
    for(const p of warpParts){ p.a+=p.sp; p.r-=0.6; if(p.r<6){ p.r=30+Math.random()*120; p.a=Math.random()*Math.PI*2; } }
    const acc=(warpT>T.holeOpen)?6:2;     // 开孔后吸入加速
    for(const s of warpStreaks){
      const dx=hx-s.x, dy=hy-s.y, d=Math.hypot(dx,dy)||1;
      const sp=4+acc; s.x+=dx/d*sp; s.y+=dy/d*sp;
      if(d<14) Object.assign(s, newStreak());
    }
    // Boss 塌缩模式：螺旋吸入金币/道具 + 舰船拖拽（全程自动，不依赖玩家操作）
    if(warpMode==='boss' && warpT<WARP_BOSS.inEnd){
      const pull=3 + warpT*0.15;   // 逐渐增强的引力
      for(let i=coins.length-1;i>=0;i--){
        const c=coins[i];
        const dx=hx-c.x, dy=hy-c.y, d=Math.hypot(dx,dy)||1;
        c.x+=dx/d*pull; c.y+=dy/d*pull;
        const a=Math.atan2(dy,dx)+0.08; c.x+=Math.cos(a)*1.5; c.y+=Math.sin(a)*1.5;   // 螺旋旋转
        if(d<26){ Save.addRunCoins(c.value); updateHUD(); coins.splice(i,1); }
      }
      for(let i=powerups.length-1;i>=0;i--){
        const p=powerups[i];
        const dx=hx-p.x, dy=hy-p.y, d=Math.hypot(dx,dy)||1;
        p.x+=dx/d*pull; p.y+=dy/d*pull;
        const a=Math.atan2(dy,dx)+0.08; p.x+=Math.cos(a)*1.5; p.y+=Math.sin(a)*1.5;
        if(d<26){ applyPowerup(p); powerups.splice(i,1); }
      }
      // 舰船：从当前位置被拖向黑洞（easeIn 三次方加速曲线）
      if(warpT>=WARP_BOSS.holeOpen){
        const k=Math.min(1, (warpT-WARP_BOSS.holeOpen)/(WARP_BOSS.inEnd-WARP_BOSS.holeOpen));
        player.x=lerp(collapseStartX, hx, easeIn(k));
        player.y=lerp(collapseStartY, hy, easeIn(k));
      }
    }
    if(warpT>=T.total) endWarp();
  }
  function endWarp(){
    warpSkip.classList.add('hidden');
    warpMode='normal';
    runLives = lives;   // 携带本关剩余命数到下一关（方案B：命数跨关累计消耗）
    showResult(true);   // 统一结算画面
  }
  function skipWarp(){ if(state===State.WARP) endWarp(); }
  function drawBlackHole(x,y,sc,t){
    if(sc<=0) return;
    const R=70*sc;
    ctx.save(); ctx.translate(x,y); ctx.rotate(t*0.05);
    for(const p of warpParts){
      const px=Math.cos(p.a)*p.r*sc, py=Math.sin(p.a)*p.r*sc;
      ctx.globalAlpha=0.5*(p.r/150);
      ctx.fillStyle = (p.r>70)?'#ffd76a':'#7ab8ff';
      ctx.beginPath(); ctx.arc(px,py,p.sz,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
    ctx.save();
    const g=ctx.createRadialGradient(x,y,0, x,y,R);
    g.addColorStop(0,'#000000');
    g.addColorStop(0.6,'rgba(8,6,20,0.95)');
    g.addColorStop(0.78,'rgba(120,90,255,0.55)');
    g.addColorStop(1,'rgba(120,90,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=0.8; ctx.strokeStyle='rgba(150,120,255,0.9)'; ctx.lineWidth=3*sc;
    ctx.beginPath(); ctx.arc(x,y,R*0.82,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  function drawWarpShip(alpha){
    // Boss 塌缩模式：舰船被吸入黑洞 → 从屏幕下方正中飞出
    if(warpMode==='boss'){
      const Tb=WARP_BOSS, T=warpT;
      // Phase 1：舰船从被拖向黑洞到消失（holeOpen → inEnd）
      if(T<Tb.inEnd){
        let sc;
        if(T<Tb.holeOpen) sc=1;
        else { const k=(T-Tb.holeOpen)/(Tb.inEnd-Tb.holeOpen); sc=lerp(1, 0.08, easeIn(k)); }
        // 向下拖尾（与舰船共享同一缩放上下文，确保缩放时尾部不脱节）
        if(T>Tb.holeOpen){
          // 拖尾与战机共享缩放上下文，固定 18px 尾部偏移（各皮肤视觉通用）
          ctx.save(); ctx.globalAlpha=alpha*0.4; ctx.strokeStyle='rgba(180,230,255,0.5)'; ctx.lineWidth=2*sc;
          ctx.translate(player.x, player.y); ctx.scale(sc,sc); ctx.translate(-player.x, -player.y);
          const tailOff=18, trailLen=24;
          for(let i=0;i<6;i++){ const ox=(i-2.5)*7; ctx.beginPath(); ctx.moveTo(player.x+ox, player.y+tailOff); ctx.lineTo(player.x+ox, player.y+tailOff+trailLen); ctx.stroke(); }
          ctx.restore();
        }
        ctx.save(); ctx.globalAlpha=alpha;
        ctx.translate(player.x, player.y); ctx.scale(sc,sc); ctx.translate(-player.x, -player.y);
        drawPlayer();
        ctx.restore();
        return;
      }
      if(T>=Tb.outEnd){
        const k=Math.min(1, (T-Tb.outEnd)/(Tb.total-Tb.outEnd));
        const x=W/2, y=lerp(H+50, H-120, easeInOut(k));
        const sc=lerp(0.3, 1, k);
        // 向下拖尾
        ctx.save(); ctx.globalAlpha=alpha*0.55; ctx.strokeStyle='rgba(180,230,255,0.7)'; ctx.lineWidth=2;
        for(let i=0;i<5;i++){ const ox=(i-2)*10; const ty=y+sc*34; ctx.beginPath(); ctx.moveTo(x+ox, ty); ctx.lineTo(x+ox, ty+24*sc); ctx.stroke(); }
        ctx.restore();
        player.x=x; player.y=y;
        ctx.save(); ctx.globalAlpha=alpha;
        ctx.translate(x,y); ctx.scale(sc,sc); ctx.translate(-x,-y);
        drawPlayer();
        ctx.restore();
      }
      return;
    }
    // 正常跃迁：原逻辑（黑洞在上方 → 舰船从底部吸入 → 钻出）
    const T=warpT; let x,y,sc;
    if(T<WARP.holeOpen){ x=W/2; y=H-30; sc=1; }                                  // 先在底部可见停留（黑洞张开）
    else if(T<WARP.inEnd){ const k=easeInOut((T-WARP.holeOpen)/(WARP.inEnd-WARP.holeOpen)); x=lerp(W/2,hx,k); y=lerp(H-30,hy,k); sc=lerp(1,0.25,k); }
    else if(T<WARP.flashEnd){ const k=(T-WARP.inEnd)/(WARP.flashEnd-WARP.inEnd); x=hx; y=hy; sc=lerp(0.25,0,k); }
    else if(T<WARP.outEnd){ const k=easeInOut((T-WARP.flashEnd)/(WARP.outEnd-WARP.flashEnd)); x=W/2; y=lerp(H+50,H-120,k); sc=lerp(0.25,1,k); }
    else { x=W/2; y=H-120; sc=1; }
    if(T>WARP.holeOpen && T<WARP.outEnd){   // 向上运动（吸入/钻出）均画向下拖尾，强化"飞入"观感
      ctx.save(); ctx.globalAlpha=alpha*0.55; ctx.strokeStyle='rgba(180,230,255,0.7)'; ctx.lineWidth=2;
      for(let i=0;i<5;i++){ const ox=(i-2)*10; const ty=y+sc*34; ctx.beginPath(); ctx.moveTo(x+ox, ty); ctx.lineTo(x+ox, ty+24*sc); ctx.stroke(); }
      ctx.restore();
    }
    player.x=x; player.y=y;
    ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y); ctx.scale(sc,sc); ctx.translate(-x,-y); drawPlayer(); ctx.restore();
  }
  function drawWarp(){
    ctx.clearRect(0,0,W,H);
    drawSpace();
    const T=warpT, Wt=(warpMode==='boss')?WARP_BOSS:WARP;   // 当前模式的时序
    let holeScale=0, flash=0, layerAlpha=1;
    if(warpMode==='boss'){
      // Boss 塌缩：黑洞成型 → 全程无闪白，洞在 outEnd 前渐隐
      if(T<Wt.holeOpen) holeScale=easeOut(T/Wt.holeOpen);
      else if(T<Wt.inEnd) holeScale=1;
      else if(T<Wt.outEnd) holeScale=Math.max(0, 1-(T-Wt.inEnd)/(Wt.outEnd-Wt.inEnd));
      else holeScale=0;
    } else {
      if(T<Wt.holeOpen) holeScale=easeOut(T/Wt.holeOpen);
      else if(T<Wt.flashEnd) holeScale = (T<Wt.inEnd)?1: Math.max(0, 1-(T-Wt.inEnd)/(Wt.flashEnd-Wt.inEnd));
      else holeScale=0;
      if(T>=Wt.inEnd && T<Wt.flashEnd){ const k=(T-Wt.inEnd)/(Wt.flashEnd-Wt.inEnd); flash=Math.sin(k*Math.PI); }
    }
    if(T>Wt.outEnd) layerAlpha=Math.max(0, 1-(T-Wt.outEnd)/(Wt.total-Wt.outEnd));
    // 吸入条纹
    ctx.save(); ctx.globalAlpha=layerAlpha; ctx.strokeStyle='rgba(180,210,255,0.5)'; ctx.lineWidth=2;
    for(const s of warpStreaks){ const dx=hx-s.x, dy=hy-s.y, d=Math.hypot(dx,dy)||1; const tx=s.x-dx/d*22, ty=s.y-dy/d*22; ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(tx,ty); ctx.stroke(); }
    ctx.restore();
    drawBlackHole(hx, hy, holeScale, T);
    drawWarpShip(layerAlpha);
    if(flash>0){ ctx.save(); ctx.globalAlpha=flash*0.9; ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.restore(); }
  }

  // ============ 征程地图 ============
  function computeMapNodes(){
    mapNodes=[];
    const L=CONFIG.levels.max;                       // 总关数（改 CONFIG.levels.max 即自动增减）
    const cx=W/2;
    const runW=Math.min(W-110, 330);                 // 单段横向跨度
    const perRun=4;                                 // 每段节点数（折返一次）
    const rowH=104;                                 // 段间竖直间距
    const topPad=90, botPad=90;
    const runs=Math.ceil(L/perRun);
    mapWorldH=runs*rowH + topPad + botPad;          // 世界高度（可高于屏幕）
    let level=1;
    for(let r=0;r<runs;r++){
      const y=mapWorldH - botPad - r*rowH;          // 自底向上逐段升高（第1关在底部）
      const ltr=(r%2===0);                          // 左右交替 -> 折返折线
      const x0=cx-(ltr?runW/2:-runW/2);
      const x1=cx+(ltr?runW/2:-runW/2);
      const cnt=Math.min(perRun, L-(r*perRun));
      for(let j=0;j<cnt;j++){
        const f=cnt===1?0.5:j/(cnt-1);
        const wob=Math.sin(f*Math.PI)*(ltr?1:-1)*12; // 轻微正弦起伏，路径更像蜿蜒星轨
        mapNodes.push({ x:x0+(x1-x0)*f + wob, y:y, level:level });
        level++;
      }
    }
  }
  function mapMaxUnlocked(){ return gameMode==='bossrush' ? Save.bossrushUnlocked() : Save.campaignUnlocked(); }
  function showMap(completedLevel){
    show(null);   // 隐藏所有屏幕（主菜单/结算等）
    player={x:0,y:0,skin:selSkin||'vanguard',w:44,h:52,invuln:0,invincT:0};   // 地图用最小player，避免残值影响渲染
    if(completedLevel>0){
      const key=gameMode==='bossrush'?'bossrush':'campaign';
      Save.setUnlocked(key, completedLevel+1);
      mapUnlockBurst=60; mapUnlockedLevel=completedLevel+1;
    }
    computeMapNodes();
    // 创建 DOM 按钮（靠 DOM 点击，不走 canvas 坐标计算）
    const nd=el('mapNodes'); nd.innerHTML='';
    const maxU=mapMaxUnlocked();
    for(const n of mapNodes){
      const b=document.createElement('button');
      b.className='map-node'+(n.level>maxU?' locked':'');
      b.style.left=n.x+'px';
      b.textContent=n.level<=maxU?n.level:'🔒';
      b.title=n.level<=maxU?'进入第 '+n.level+' 关':'未解锁';
      if(n.level<=maxU){
        b.onclick=()=>{ startLevelFromMap(n.level); };
        b.addEventListener('touchend',e=>{ e.preventDefault(); startLevelFromMap(n.level); });
      }
      n._btn=b; nd.appendChild(b);
    }
    // 摄像机自动对准当前关卡（居中显示）
    const cur=mapNodes.find(n=>n.level===maxU);
    mapCamY = cur ? Math.max(0, Math.min(cur.y - H*0.5, Math.max(0, mapWorldH - H)))
                  : Math.max(0, mapWorldH - H);
    layoutMapButtons();
    state=State.MAP; hud.classList.add('hidden');
    el('mapOverlay').classList.remove('hidden');
    const modeLabel=gameMode==='bossrush'?'泰坦猎杀':'深空远征';
    el('mapSubtitle').textContent=modeLabel+' · 已解锁至第 '+mapMaxUnlocked()+' 关';
  }
  function updateMap(){ tick++; if(mapUnlockBurst>0) mapUnlockBurst--; mapDash+=0.22; }
  function clampMapCam(){ const maxC=Math.max(0, mapWorldH-H); mapCamY=Math.max(0, Math.min(mapCamY, maxC)); }
  function layoutMapButtons(){
    for(const n of mapNodes){
      const b=n._btn; if(!b) continue;
      const sy=n.y - mapCamY;                       // 世界坐标 -> 屏幕坐标
      if(sy < -30 || sy > H+30){ b.style.display='none'; }   // 视口外隐藏，避免误触/杂乱
      else { b.style.display=''; b.style.top=sy+'px'; }
    }
  }
  function updateMapScrollHint(){
    const bar=el('mapScrollBar'), thumb=el('mapScrollThumb'), hint=el('mapScrollHint');
    if(!bar) return;
    const scrollable=mapWorldH>H+2;
    bar.style.display=scrollable?'':'none';
    if(hint) hint.style.display=scrollable?'':'none';
    if(!scrollable) return;
    const maxC=Math.max(1, mapWorldH-H);
    const trackH=bar.clientHeight;
    const thumbH=Math.max(24, trackH*H/mapWorldH);
    const ratio=Math.max(0,Math.min(1, mapCamY/maxC));
    thumb.style.height=thumbH+'px';
    thumb.style.top=(ratio*(trackH-thumbH))+'px';
  }
  function drawMapNode(n){
    const maxU=mapMaxUnlocked();
    const unlocked=n.level<=maxU;
    const isCurrent=n.level===maxU;
    const isBurst=n.level===mapUnlockedLevel&&mapUnlockBurst>0;
    // 光晕
    if(unlocked){
      const pulse=isCurrent?(2+Math.sin(tick*0.08)*2):0;   // 当前关呼吸脉冲
      ctx.beginPath(); ctx.arc(n.x,n.y,(isCurrent?29:23)+pulse,0,7);
      const g=ctx.createRadialGradient(n.x,n.y,10,n.x,n.y,29+pulse);
      if(isCurrent){ g.addColorStop(0,'rgba(255,215,106,.5)'); g.addColorStop(1,'rgba(255,180,50,0)'); }
      else { g.addColorStop(0,'rgba(100,200,255,.35)'); g.addColorStop(1,'rgba(80,160,220,0)'); }
      ctx.fillStyle=g; ctx.fill();
      if(isBurst){
        ctx.beginPath(); ctx.arc(n.x,n.y,23+mapUnlockBurst*0.8,0,7);
        ctx.strokeStyle='rgba(255,215,80,'+(mapUnlockBurst/60).toFixed(2)+')'; ctx.lineWidth=3; ctx.stroke();
      }
    }
    // 节点圆
    ctx.beginPath(); ctx.arc(n.x,n.y,17,0,7);
    ctx.fillStyle=unlocked?'rgba(20,30,50,.9)':'rgba(30,30,40,.6)';
    ctx.fill();
    ctx.strokeStyle=unlocked?(isCurrent?'#ffd76a':'#6ec8ff'):'#444';
    ctx.lineWidth=isCurrent?3:2; ctx.stroke();
    // 数字 / 锁 已由 DOM 按钮绘制，canvas 不再画，避免加粗重影
    ctx.textAlign='center'; ctx.textBaseline='middle';
    // 通关标记
    if(unlocked&&!isCurrent){ ctx.fillStyle='#6ec8ff'; ctx.font='9px sans-serif'; ctx.fillText('✔', n.x, n.y-18); }
    // 可挑战标签
    if(isCurrent){ ctx.fillStyle='#ffd76a'; ctx.font='9px sans-serif'; ctx.fillText('可挑战', n.x, n.y+24); }
  }
  // Catmull-Rom 平滑样条：让征程路线告别生硬折线，呈流动星轨质感
  function catmullRomPath(pts){
    if(!pts||pts.length===0) return;
    if(pts.length===1){ ctx.moveTo(pts[0].x, pts[0].y); return; }
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
      const cp1x=p1.x+(p2.x-p0.x)/6, cp1y=p1.y+(p2.y-p0.y)/6;
      const cp2x=p2.x-(p3.x-p1.x)/6, cp2y=p2.y-(p3.y-p1.y)/6;
      ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,p2.x,p2.y);
    }
  }
  function catmullRomAt(pts, t){
    if(pts.length===1) return {x:pts[0].x, y:pts[0].y};
    t=Math.max(0, Math.min(pts.length-1, t));
    const i=Math.floor(t), u=t-i;
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const u2=u*u, u3=u2*u;
    const x=0.5*((2*p1.x)+(-p0.x+p2.x)*u+(2*p0.x-5*p1.x+4*p2.x-p3.x)*u2+(-p0.x+3*p1.x-3*p2.x+p3.x)*u3);
    const y=0.5*((2*p1.y)+(-p0.y+p2.y)*u+(2*p0.y-5*p1.y+4*p2.y-p3.y)*u2+(-p0.y+3*p1.y-3*p2.y+p3.y)*u3);
    return {x,y};
  }
  // 在节点之间插入正弦编织的中间点，提升曲率复杂度（首尾归零以仍经过真实节点）
  function weavePoints(pts, amp, waves, sub){
    if(!pts||pts.length===0) return [];
    if(pts.length===1) return [{x:pts[0].x, y:pts[0].y}];
    const out=[];
    for(let i=0;i<pts.length-1;i++){
      const A=pts[i], B=pts[i+1];
      out.push({x:A.x, y:A.y});
      const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1;
      const px=-dy/len, py=dx/len;                       // 垂直方向
      for(let j=1;j<=sub;j++){
        const f=j/(sub+1);
        const off=amp*Math.sin(f*Math.PI)*Math.sin(f*Math.PI*waves);   // 包络 sin(fπ) 保证首尾贴合节点
        out.push({ x:A.x+dx*f+px*off, y:A.y+dy*f+py*off });
      }
    }
    out.push({x:pts[pts.length-1].x, y:pts[pts.length-1].y});
    return out;
  }
  function drawMap(){
    const maxU=mapMaxUnlocked();
    ctx.save();
    ctx.translate(0,-mapCamY);                       // 摄像机：世界坐标 -> 屏幕坐标
    // 分层发光丝带：Catmull-Rom 平滑样条（告别生硬折线，呈流动星轨）
    ctx.lineCap='round'; ctx.lineJoin='round';
    const allW=weavePoints(mapNodes, 14, 2, 6);
    const unlockedW=weavePoints(mapNodes.filter(n=>n.level<=maxU), 14, 2, 6);
    // 暗色底层（全路线引导，蜿蜒更复杂）
    ctx.beginPath(); catmullRomPath(allW);
    ctx.strokeStyle='rgba(80,120,190,.12)'; ctx.lineWidth=12; ctx.stroke();
    ctx.beginPath(); catmullRomPath(allW);
    ctx.strokeStyle='rgba(90,150,220,.20)'; ctx.lineWidth=6; ctx.stroke();
    // 已解锁高亮平滑线 + 流动虚线 + 行进光点
    if(unlockedW.length>=2){
      ctx.beginPath(); catmullRomPath(unlockedW);
      ctx.strokeStyle='rgba(120,200,255,.6)'; ctx.lineWidth=3.5; ctx.stroke();
      ctx.setLineDash([3,13]); ctx.lineDashOffset=-mapDash;
      ctx.beginPath(); catmullRomPath(unlockedW);
      ctx.strokeStyle='rgba(200,240,255,.9)'; ctx.lineWidth=2; ctx.stroke();
      ctx.setLineDash([]);
      // 沿曲线游走的彗星光晕（延伸/行进感）
      const segN=unlockedW.length-1;
      const phase=((mapDash*0.03)%1)*segN;
      const head=catmullRomAt(unlockedW, phase);
      const tail=catmullRomAt(unlockedW, Math.max(0, phase-1.4));
      ctx.save();
      ctx.shadowColor='rgba(180,235,255,.9)'; ctx.shadowBlur=16;
      const grd=ctx.createLinearGradient(tail.x,tail.y,head.x,head.y);
      grd.addColorStop(0,'rgba(120,200,255,0)'); grd.addColorStop(1,'rgba(215,245,255,1)');
      ctx.strokeStyle=grd; ctx.lineWidth=3.5;
      ctx.beginPath(); ctx.moveTo(tail.x,tail.y); ctx.lineTo(head.x,head.y); ctx.stroke();
      ctx.fillStyle='#eafcff'; ctx.beginPath(); ctx.arc(head.x,head.y,3.2,0,7); ctx.fill();
      ctx.restore();
    }
    // 节点
    for(const n of mapNodes) drawMapNode(n);
    ctx.restore();
  }
  function hitMapNode(tx,ty){
    for(const n of mapNodes){
      if(Math.hypot(tx-n.x,ty-n.y)<28){
        if(n.level<=mapMaxUnlocked()) return n;
      }
    }
    return null;
  }

  // ============ Loop ============
  let lastT=0, acc=0;                 // 固定步长累加器：模拟以 60Hz 推进，与屏幕刷新率解耦
  function loop(now){
    now = now || performance.now();
    if(!lastT) lastT=now;
    const dtMs=now-lastT; lastT=now;
    if(state===State.PLAY){
      acc += Math.min(dtMs, 100);     // 切后台回来时钳制，避免一次性追帧爆炸
      const STEP=1000/60; let steps=0;
      while(acc>=STEP && steps<6){ update(); acc-=STEP; steps++; }
      draw();
    } else if(state===State.WARP){           // 过场：黑洞跳跃（固定步长推进）
      acc += Math.min(dtMs, 100);
      const STEP=1000/60; let steps=0;
      while(acc>=STEP && steps<6){ updateWarp(); acc-=STEP; steps++; }
      drawWarp();
    } else if(state===State.PAUSE||state===State.OVER){ draw(); }
    else if(state===State.DYING){ stepParticles(); draw(); if(--deathT<=0) showResult(false); }   // 死亡特效播放中，结束后进结算
    else if(state===State.MAP){ updateSpace(); updateMap(); clampMapCam(); ctx.clearRect(0,0,W,H); drawSpace(); drawMap(); layoutMapButtons(); updateMapScrollHint(); }   // 征程地图
    else { // menu / boot: idle deep-space
      if(!stars) initStars();
      tick++;
      updateSpace();
      ctx.clearRect(0,0,W,H);
      drawSpace();
    }
    requestAnimationFrame(loop);
  }

  // ============ Boot ============
  buildSprites(); resize(); initStars(); show(startScreen); loop();

  // ============ Encyclopedia ============
  let encyclopediaTab = 'fighters'; // 'fighters' | 'wingmen' | 'bosses' | 'enemies' | 'drops'

  function openEncyclopedia(){
    state = State.ENCYCLOPEDIA;
    hud.classList.add('hidden');
    show(encyclopediaScreen);
    encyclopediaTab = 'fighters';
    renderEncyclopedia();
    // highlight tab
    const tabs = encyclopediaTabs.querySelectorAll('.encyclopedia-tab');
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === encyclopediaTab));
  }

  function drawEnemyThumb(cv, enemyKey){
    if(!cv.isConnected){ requestAnimationFrame(()=>drawEnemyThumb(cv,enemyKey)); return; }
    const em = CONFIG.enemies[enemyKey];
    const r = cv.getBoundingClientRect ? cv.getBoundingClientRect() : {width:200, height:70};
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const w = r.width || 200, h = r.height || 70;
    cv.width = Math.max(1, Math.round(w*dpr));
    cv.height = Math.max(1, Math.round(h*dpr));
    const g = cv.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);
    g.clearRect(0,0,w,h);
    const savedCtx = ctx, savedTick = tick;
    tick = 4; ctx = g;
    const fake = { x: w/2, y: h*0.55, w: em.w, h: em.h, hp: em.hp, maxhp: em.hp, type: enemyKey };
    const s = Math.min((w*0.7)/(em.w||38), (h*0.7)/(em.h||38));
    g.save(); g.translate(fake.x, fake.y); g.scale(s,s);
    em.draw(fake);
    g.restore();
    ctx = savedCtx; tick = savedTick;
  }

  function drawBossThumb(cv, archIndex){
    const A = CONFIG.boss.archs[archIndex];
    // 固定 300×300 内部分辨率 → CSS scale 到卡片尺寸，保证细节清晰
    const IW = 300, IH = 300;
    cv.width = IW; cv.height = IH;
    cv.style.width = '110px'; cv.style.height = '110px';
    const g = cv.getContext('2d');
    g.setTransform(1,0,0,1,0,0);
    g.clearRect(0,0,IW,IH);
    const savedCtx = ctx, savedTick = tick, savedBlush = bossPhaseBlush;
    tick = 4; ctx = g;
    bossPhaseBlush = function(){};
    ctx.shadowBlur = 0;
    Object.defineProperty(ctx, 'shadowBlur', {set:function(){}, get:function(){return 0;}, configurable:true});
    const bw = A.w || CONFIG.boss.w, bh = A.h || CONFIG.boss.h;
    const s = Math.min((IW*0.88)/bw, (IH*0.88)/bh);
    const fakeBoss = { x: 0, y: 0, w: bw, h: bh, phase: 0, flash: 0, color: A.color, rings: [], arch: archIndex };
    g.save(); g.translate(IW/2, IH/2); g.scale(s,s);
    const fn = A.draw;
    if (typeof fn === 'function') fn(fakeBoss);
    g.restore();
    delete ctx.shadowBlur;
    bossPhaseBlush = savedBlush;
    ctx = savedCtx; tick = savedTick;
  }
  function drawFighterThumb(cv, skin){
    if(!cv.isConnected){ requestAnimationFrame(()=>drawFighterThumb(cv,skin)); return; }
    const { g, w, h } = prepThumb(cv);
    const s = Math.min(w*0.7/(skin.w||44), h*0.7/(skin.h||52));
    const savedCtx=ctx, hadP=player, ti=tick;
    player={x:w/2, y:h*0.55}; tick=4; ctx=g;
    g.save(); g.translate(w/2, h*0.55); g.scale(s,s); g.translate(-w/2, -h*0.55);
    skin.draw();
    g.restore();
    ctx=savedCtx; player=hadP; tick=ti;
  }
  function drawWingThumb(cv, wingKey){
    if(!cv.isConnected){ requestAnimationFrame(()=>drawWingThumb(cv,wingKey)); return; }
    const wt=CONFIG.player.wingTypes[wingKey];
    const { g, w, h } = prepThumb(cv);
    const savedCtx=ctx, ti=tick;
    tick=4; ctx=g;
    g.save(); g.translate(w/2, h/2);
    g.shadowColor=wt.color; g.shadowBlur=8;
    (wt.draw||drawWingGunner)(wt.color);
    g.restore();
    ctx=savedCtx; tick=ti;
  }
  // 通用图标缩略图：彩色发光圆 + 中心字形（掉落图鉴 / 商店道具共用，保证两处视觉一致）
  function drawIconThumb(cv, color, label){
    if(!cv.isConnected){ requestAnimationFrame(()=>drawIconThumb(cv,color,label)); return; }
    const { g, w, h } = prepThumb(cv);
    const cx=w/2, cy=h/2, R=Math.min(w,h)*0.30;
    g.save();
    g.shadowColor=color; g.shadowBlur=18; g.fillStyle=color;
    g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill();
    g.shadowBlur=0; g.fillStyle='#04121a'; g.textAlign='center'; g.textBaseline='middle';
    g.font='800 '+Math.round(R*1.1)+'px sans-serif'; g.fillText(label||'?', cx, cy+1);
    g.restore();
  }
  function drawDropThumb(cv, key){
    const t = CONFIG.powerups.types[key] || {color:'#fff', label:'?'};
    drawIconThumb(cv, t.color, t.label);
  }
  function renderEncyclopedia(){
    encyclopediaList.innerHTML = '';
    if (encyclopediaTab === 'fighters'){
      encyclopediaList.appendChild(secTitle('战机'));
      const grid = el2('div', 'hangar-grid');
      for (const sk of CONFIG.player.skins){
        const card = el2('div', 'hangar-card');
        const cv = el2('canvas', 'thumb');
        drawFighterThumb(cv, sk);
        card.appendChild(cv);
        card.appendChild(el2('div', 'nm', sk.name));
        card.appendChild(el2('div', 'stat', sk.price===0?'默认':'¥'+sk.price));
        const pt=PASSIVE_NAMES[sk.passive?.type]||'';
        const un=getUltName(sk.ultimate?.type);
        card.appendChild(el2('div', 'stat', '被动·'+pt+'  |  大招·'+un));
        grid.appendChild(card);
      }
      encyclopediaList.appendChild(grid);
    } else if (encyclopediaTab === 'wingmen'){
      encyclopediaList.appendChild(secTitle('僚机'));
      const grid = el2('div', 'hangar-grid');
      for (const key of Object.keys(CONFIG.player.wingTypes)){
        const wt = CONFIG.player.wingTypes[key];
        const card = el2('div', 'hangar-card');
        const cv = el2('canvas', 'thumb');
        drawWingThumb(cv, key);
        card.appendChild(cv);
        card.appendChild(el2('div', 'nm', wt.name));
        card.appendChild(el2('div', 'stat', '价格 ¥'+(CONFIG.player.shop.wingType[key]||0)));
        const ht=wt.homing?'追踪':'直射';
        card.appendChild(el2('div', 'stat', ht+'  |  伤害 '+((wt.beam?.dmg||wt.dmg||0))));
        grid.appendChild(card);
      }
      encyclopediaList.appendChild(grid);
    } else if (encyclopediaTab === 'bosses'){
      encyclopediaList.appendChild(secTitle('BOSS · 关卡首领'));
      for (let i = 0; i < CONFIG.boss.archs.length; i++){
        const A = CONFIG.boss.archs[i];
        const lv=i+1, hp=Math.round(CONFIG.boss.hp(lv));
        const row = el2('div', 'ency-boss');
        const left = el2('div', 'ency-boss-left');
        const cv = el2('canvas', 'thumb');
        drawBossThumb(cv, i);
        left.appendChild(cv);
        row.appendChild(left);
        const right = el2('div', 'ency-boss-right');
        // 名称行：名字 + 关卡徽章
        const nameRow=el2('div','boss-name-row');
        nameRow.appendChild(el2('div','nm',A.name));
        const badge=el2('div','boss-badge'); badge.textContent='第 '+lv+' 关'; nameRow.appendChild(badge);
        right.appendChild(nameRow);
        right.appendChild(el2('div','boss-hp-text','HP '+hp.toLocaleString()));
        // 狂怒阶段
        const phases=A.phase||CONFIG.boss.phase||[];
        if(phases.length) right.appendChild(el2('div','boss-phases','狂怒 ▸ '+phases.map(p=>Math.round(p*100)+'%').join(' · ')));
        // 描述
        right.appendChild(el2('div','boss-desc',A.desc||''));
        row.appendChild(right);
        encyclopediaList.appendChild(row);
      }
    } else if (encyclopediaTab === 'enemies'){
      // 按分类分组展示
      const cats=[ 'normal','elite','sentinel','hazard' ];
      for(const ck of cats){
        const ci=CATEGORY[ck]; const list=[];
        for(const key of Object.keys(CONFIG.enemies)){
          const e=CONFIG.enemies[key];
          if(!e||!e.draw) continue;
          if(catOf(key)!==ck) continue;
          list.push(e);
        }
        if(!list.length) continue;
        encyclopediaList.appendChild(secTitle(ci.icon+' '+ci.name));
        const grid=el2('div','hangar-grid');
        for(const e of list){
          const card=el2('div','hangar-card');
          const cv=el2('canvas','thumb');
          drawEnemyThumb(cv, e.key);
          card.appendChild(cv);
          const hdr=el2('div','nm',{style:'font-size:12px;color:'+ci.color}); hdr.textContent=e.name;
          card.appendChild(hdr);
          card.appendChild(el2('div','stat','HP '+e.hp+'  ·  得分 '+e.score));
          card.appendChild(el2('div','stat',e.desc||''));
          grid.appendChild(card);
        }
        encyclopediaList.appendChild(grid);
      }
    } else if (encyclopediaTab === 'drops'){
      // 完全数据驱动：遍历 CONFIG.powerups.types，新增奖励只需在 types 加一条（带 name/desc），无需改动此处
      encyclopediaList.appendChild(secTitle('掉落奖励'));
      const grid = el2('div', 'hangar-grid');
      for (const key of Object.keys(CONFIG.powerups.types)){
        const t = CONFIG.powerups.types[key];
        const card = el2('div', 'hangar-card');
        const cv = el2('canvas', 'thumb');
        drawDropThumb(cv, key);
        card.appendChild(cv);
        card.appendChild(el2('div', 'nm', t.name || key));
        card.appendChild(el2('div', 'stat', '小兵/Boss 掉落 · 金币 35%'));
        card.appendChild(el2('div', 'stat', t.desc || ''));
        grid.appendChild(card);
      }
      encyclopediaList.appendChild(grid);
    }
    // tab click handlers
    const tabs = encyclopediaTabs.querySelectorAll('.encyclopedia-tab');
    tabs.forEach(tab => {
      tab.onclick = () => {
        encyclopediaTab = tab.dataset.tab;
        tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === encyclopediaTab));
        renderEncyclopedia();
      };
    });
  }
})();
