<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>星际战机 · 飞机大战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root{
    --neon:#22e6ff; --neon2:#c05cff; --gold:#ffd76a; --danger:#ff4d6d;
    --bg0:#06040f; --bg1:#140a30; --panel:rgba(26,16,54,.74);
    --stroke:rgba(180,140,255,.30);
  }
  html,body{ height:100%; }
  body{
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:
      radial-gradient(900px 700px at 82% 8%, rgba(255,64,160,.20), transparent 60%),
      radial-gradient(1000px 800px at 12% 88%, rgba(120,60,255,.22), transparent 62%),
      radial-gradient(1200px 900px at 50% -12%, #2a1250 0%, #140a30 42%, #06040f 100%);
    color:#f3eaff; overflow:hidden; user-select:none;
  }
  #app{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:1; }
  #wrap{
    position:relative; width:min(100vw,480px); height:min(100vh,860px);
    box-shadow:0 0 70px rgba(170,60,255,.4), 0 0 30px rgba(255,60,150,.25), inset 0 0 0 1px rgba(180,140,255,.18);
    overflow:hidden; background:#050211;
  }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  /* ---------- Overlays ---------- */
  .screen{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:28px;
    background:
      radial-gradient(500px 400px at 78% 18%, rgba(255,64,160,.22), transparent 60%),
      radial-gradient(600px 500px at 50% 34%, rgba(120,60,255,.30), rgba(5,2,17,.92));
    backdrop-filter:blur(3px); z-index:5; text-align:center;
    animation:fade .4s ease;
  }
  .hidden{ display:none !important; }
  .notify{ position:fixed; top:22px; left:50%; transform:translateX(-50%) translateY(-12px);
    background:linear-gradient(135deg,#3a2a00,#5a3d00); border:1px solid var(--gold); color:var(--gold);
    font-weight:800; font-size:14px; padding:10px 18px; border-radius:12px; white-space:nowrap;
    box-shadow:0 8px 28px rgba(255,200,60,.32); opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; z-index:60; }
  .notify.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  @keyframes fade{ from{opacity:0; transform:scale(.98)} to{opacity:1; transform:scale(1)} }

  .logo{ font-size:44px; font-weight:900; letter-spacing:2px; line-height:1.05; transform:translateY(-22px);
    background:linear-gradient(180deg,#fff, var(--neon) 60%, var(--neon2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 28px rgba(34,230,255,.35); }
  .sub{ font-size:13px; letter-spacing:6px; color:#8fb0ff; text-transform:uppercase; opacity:.85; transform:translateY(-22px); }

  .card{
    width:100%; max-width:360px; background:var(--panel); border:1px solid var(--stroke);
    border-radius:18px; padding:22px 20px; box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .nick-row{ display:flex; gap:10px; }
  input#nick{
    flex:1; background:rgba(6,10,30,.8); border:1px solid var(--stroke); color:#fff;
    border-radius:12px; padding:9px 12px; font-size:13px; outline:none; transition:.2s;
  }
  input#nick:focus{ border-color:var(--neon); box-shadow:0 0 0 3px rgba(34,230,255,.18); }
  .btn{
    border:none; cursor:pointer; border-radius:12px; font-weight:700; letter-spacing:1px;
    padding:10px 14px; font-size:13px; color:#04121a; transition:transform .12s, box-shadow .2s, filter .2s;
    background:linear-gradient(135deg, var(--neon), #4fd6ff 40%, var(--neon2));
    box-shadow:0 8px 24px rgba(34,230,255,.35);
  }
  .btn:hover{ transform:translateY(-2px); filter:brightness(1.08); }
  .btn:active{ transform:translateY(0); }
  .btn.dice{ flex:none; width:44px; padding:0; font-size:18px; border-radius:12px;
    background:rgba(10,16,44,.45); border:1px solid var(--stroke); color:#cfe0ff; box-shadow:none; }
  .btn.dice:hover{ border-color:var(--neon); color:#fff; }
  /* 通用幽灵胶囊：与主界面「机库」按钮同语言（玻璃底 + 细边 + 青 hover） */
  .btn.ghost{ background:rgba(10,16,44,.4); color:#cfe0ff; border:1px solid var(--stroke); box-shadow:none; }
  .btn.ghost:hover{ transform:translateY(-1px); border-color:var(--neon); color:#fff; }
  /* 主操作（确认 / 继续 / 再来）：实色青 + 青光晕，对应激活 / 就绪语言 */
  .btn.primary{ background:linear-gradient(135deg,var(--neon),#4fd6ff); color:#04121a; border:1px solid transparent;
    box-shadow:0 8px 24px rgba(34,230,255,.4); }
  .btn.primary:hover{ transform:translateY(-2px); filter:brightness(1.08); box-shadow:0 10px 30px rgba(34,230,255,.6); }
  .btn.big{ width:100%; margin-top:14px; font-size:14px; padding:12px; }
  .card.hero{ display:flex; flex-direction:column; gap:16px; align-items:center; background:transparent; border:none; box-shadow:none; padding:0; }
  .nick-chip{ align-self:center; background:rgba(10,16,44,.6); border:1px solid var(--stroke); color:#cfe0ff; border-radius:999px; padding:7px 14px; font-size:12px; cursor:pointer; transition:.15s; }
  .nick-chip:hover{ border-color:var(--neon); }
  .nick-chip b{ color:var(--gold); }
  .nick-chip .dice-ic{ opacity:.7; margin-left:4px; }
  /* 昵称修改弹窗 */
  .modal{ position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:rgba(4,8,22,.6); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); pointer-events:auto; }
  .modal-card{ width:100%; max-width:300px; background:var(--panel); border:1px solid var(--stroke);
    border-radius:16px; padding:22px 20px; box-shadow:0 20px 50px rgba(0,0,0,.6); }
  .modal-title{ font-size:15px; font-weight:800; color:#dff6ff; margin-bottom:16px; letter-spacing:1px; text-align:center; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-actions .btn{ flex:1; }
  .btn.start-orb{
    width:172px; height:172px; border-radius:50%;
    background:rgba(8,14,40,.28); border:2px solid rgba(34,230,255,.55);
    color:#dff6ff; font-size:17px; font-weight:800; letter-spacing:3px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; margin:18px 0;
    box-shadow:0 0 0 8px rgba(34,230,255,.07), 0 0 30px rgba(34,230,255,.35), inset 0 0 26px rgba(34,230,255,.16);
    animation:orbPulse 2.4s ease-in-out infinite; transition:transform .18s, border-color .18s;
  }
  .btn.start-orb:hover{ transform:scale(1.05); border-color:var(--neon); animation-play-state:paused;
    box-shadow:0 0 0 12px rgba(34,230,255,.12), 0 0 46px rgba(34,230,255,.6), inset 0 0 32px rgba(34,230,255,.3); }
  .btn.start-orb:active{ transform:scale(.97); }
  /* 主菜单：大圆 + 两个碰撞小圆 */
  .orb-cluster{ position:relative; width:340px; height:340px; margin:6px 0; }
  .orb-ring{ position:absolute; inset:0; border-radius:50%;
    border:2px solid rgba(34,230,255,.35); pointer-events:none;
    box-shadow: inset 0 0 44px rgba(34,230,255,.12), 0 0 44px rgba(34,230,255,.18); }
  .orb-mode-label{ position:absolute; left:50%; top:10px; transform:translateX(-50%);
    font-size:12px; letter-spacing:3px; color:rgba(207,224,255,.6); pointer-events:none; }
  .orb{ position:absolute; width:96px; height:96px; border-radius:50%; padding:6px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:14px; font-weight:800; letter-spacing:1px; line-height:1.2; cursor:pointer;
    color:#dff6ff; background:rgba(8,14,40,.30); border:2px solid rgba(34,230,255,.55);
    box-shadow:0 0 0 8px rgba(34,230,255,.06),0 0 26px rgba(34,230,255,.35),inset 0 0 22px rgba(34,230,255,.18);
    animation:orbFloat 2.6s ease-in-out infinite; transition:border-color .15s; }
  .orb:hover{ border-color:var(--neon); }
  .orb.orb-boss{ color:#ffd0b0; background:rgba(40,8,14,.30); border-color:rgba(255,120,90,.6);
    box-shadow:0 0 0 8px rgba(255,120,90,.06),0 0 26px rgba(255,120,90,.32),inset 0 0 22px rgba(255,120,90,.18);
    animation-name:orbFloat2; }
  .orb.orb-boss:hover{ border-color:#ff785a; }
  .sub-row{ display:flex; gap:12px; align-items:center; justify-content:center; margin-top:4px; }
  @keyframes orbFloat{ 0%,100%{ box-shadow:0 0 0 8px rgba(34,230,255,.06),0 0 26px rgba(34,230,255,.35),inset 0 0 22px rgba(34,230,255,.18);} 50%{ box-shadow:0 0 0 12px rgba(34,230,255,.10),0 0 40px rgba(34,230,255,.6),inset 0 0 28px rgba(34,230,255,.3);} }
  @keyframes orbFloat2{ 0%,100%{ box-shadow:0 0 0 8px rgba(255,120,90,.06),0 0 26px rgba(255,120,90,.32),inset 0 0 22px rgba(255,120,90,.18);} 50%{ box-shadow:0 0 0 12px rgba(255,120,90,.10),0 0 40px rgba(255,120,90,.55),inset 0 0 28px rgba(255,120,90,.3);} }
  @keyframes orbPulse{
    0%,100%{ box-shadow:0 0 0 8px rgba(34,230,255,.07), 0 0 30px rgba(34,230,255,.35), inset 0 0 26px rgba(34,230,255,.16); }
    50%{ box-shadow:0 0 0 14px rgba(34,230,255,.13), 0 0 48px rgba(34,230,255,.6), inset 0 0 32px rgba(34,230,255,.28); }
  }
  .btn.hangar{ background:rgba(10,16,44,.4); border:1px solid var(--stroke); color:#cfe0ff;
    border-radius:999px; padding:10px 20px; font-size:13px; font-weight:700; box-shadow:none; }
  .btn.hangar:hover{ border-color:var(--neon); color:#fff; transform:translateY(-1px); }
  #warpSkip{ position:absolute; left:50%; bottom:26px; transform:translateX(-50%); z-index:30;
    pointer-events:auto; cursor:pointer; background:rgba(10,16,44,.72); border:1px solid var(--stroke);
    color:#cfe0ff; border-radius:999px; padding:9px 22px; font-size:13px; font-weight:700; letter-spacing:1px;
    box-shadow:0 8px 24px rgba(0,0,0,.4); }
  #warpSkip:hover{ border-color:var(--neon); color:#fff; }

  .hint{ font-size:12px; color:#7f96d6; margin-top:14px; line-height:2.0; }
  .kbd{ display:inline-block; background:rgba(120,160,255,.15); border:1px solid var(--stroke); border-radius:6px; padding:1px 7px; font-size:11px; }

  /* ---------- HUD ---------- */
  #hud{ position:absolute; inset:0; pointer-events:none; z-index:4; }
  .hud-top{ position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:14px 16px; }
  .score-box{ font-weight:900; font-size:15px; line-height:1.05; align-self:flex-end; }  /* 底部与右侧水平对齐 */
  .score-box .num{ display:block; font-size:24px; color:var(--gold); text-shadow:0 0 18px rgba(255,215,106,.5); }
  .score-box small{ display:block; color:var(--neon); font-size:10px; letter-spacing:1px; }
  .lv-box{ position:absolute; left:50%; top:14px; transform:translateX(-50%); text-align:center; }  /* 第X关：真正水平居中（不随左右栏宽度偏移） */
  .score-box .coin-box{ display:inline-flex; width:auto; margin-top:2px; border:none; background:transparent; padding:2px 0; font-size:13px; line-height:1; box-shadow:none; }  /* 金币移到分数正下方，去边框改纯文字 */
  .stat-right{ text-align:right; font-size:12px; color:#9fb6ff; align-self:flex-end; }  /* 底部与左侧金币水平对齐 */
  .lives{ display:flex; gap:5px; justify-content:flex-end; margin-top:4px; }
  .life{ width:14px; height:14px; filter:drop-shadow(0 0 5px var(--danger)); }
  .bar{ width:120px; height:8px; border-radius:6px; background:rgba(8,12,30,.5); overflow:hidden; margin-top:8px; margin-left:auto; border:1px solid rgba(34,230,255,.35); box-shadow:inset 0 0 8px rgba(34,230,255,.12); }
  .bar > i{ display:block; height:100%; width:100%; background:linear-gradient(90deg,var(--neon),#3affa3); transition:width .15s; }
  #pauseBtn{ pointer-events:auto; }
  /* 大招按钮：与怒气环合并，圆环表示怒气积累进度 */
  #ultBtn{ position:absolute; right:16px; bottom:18px; width:64px; height:64px; border-radius:50%; border:none; padding:0;
    background:radial-gradient(circle at 50% 38%, rgba(70,46,22,.65), rgba(18,14,28,.85)); color:#ff9a3c; font-size:24px; line-height:1;
    opacity:.5; pointer-events:auto; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.2s; }
  #ultBtn .ult-ring{ position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); pointer-events:none; }
  #ultBtn .ult-track{ fill:none; stroke:rgba(255,177,59,.18); stroke-width:4; }
  #ultBtn .ult-prog{ fill:none; stroke:#ffd000; stroke-width:4; stroke-linecap:round;
    stroke-dasharray:163.36; stroke-dashoffset:163.36; transition:stroke-dashoffset .15s; }
  #ultBtn .ult-ic{ position:relative; z-index:1; font-size:24px; filter:drop-shadow(0 0 4px rgba(255,150,40,.6)); }
  #ultBtn.ready{ opacity:1; box-shadow:0 0 24px rgba(255,200,60,.85); animation:ultPulse 1s infinite; }
  #ultBtn.ready .ult-prog{ stroke:#ffe14d; filter:drop-shadow(0 0 5px rgba(255,220,80,.95)); }
  @keyframes ultPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }
  /* 战斗左侧道具使用面板：DOM 按钮竖排，仿 #ultBtn 模式 */
  #itemPanel{ position:absolute; left:16px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:10px; pointer-events:auto; }
  .item-btn{ position:relative; width:48px; height:48px; border-radius:50%; border:2px solid rgba(34,230,255,.5);
    background:radial-gradient(circle at 50% 38%, rgba(70,46,22,.6), rgba(18,14,28,.85)); color:#fff; font-size:20px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; box-shadow:0 0 14px rgba(34,230,255,.25); }
  .item-btn:hover{ transform:scale(1.08); border-color:var(--neon); }
  .item-btn .cnt{ position:absolute; right:-4px; bottom:-4px; min-width:18px; height:18px; padding:0 4px; border-radius:9px;
    background:#ff5470; color:#fff; font-size:11px; font-weight:800; line-height:18px; text-align:center; box-shadow:0 0 6px rgba(255,84,112,.6); }

  /* ---------- Leaderboard ---------- */
  .board{ width:100%; max-width:360px; text-align:left; }
  .board h3{ font-size:14px; color:#9fb6ff; letter-spacing:2px; margin:6px 4px 10px; display:flex; justify-content:space-between; align-items:center;}
  .board .clear{ font-size:11px; color:#7f96d6; cursor:pointer; pointer-events:auto; }
  ol.rank{ list-style:none; display:flex; flex-direction:column; gap:7px; max-height:230px; overflow:auto; }
  ol.rank li{ display:flex; align-items:center; gap:10px; background:rgba(10,16,44,.7); border:1px solid var(--stroke);
    border-radius:11px; padding:9px 12px; font-size:14px; }
  ol.rank li .no{ width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:800; background:rgba(120,160,255,.2); }
  ol.rank li.top1 .no{ background:linear-gradient(135deg,#ffd76a,#ff9f1c); color:#3a2400; }
  ol.rank li.top2 .no{ background:linear-gradient(135deg,#dfe8ff,#9fb6ff); color:#1a2340; }
  ol.rank li.top3 .no{ background:linear-gradient(135deg,#ffbf87,#d9843d); color:#3a2400; }
  ol.rank li .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  ol.rank li .sc{ color:var(--gold); font-weight:800; }
  ol.rank li.me{ box-shadow:0 0 0 2px var(--neon); }
  .empty{ color:#6b7fbf; font-size:13px; text-align:center; padding:24px 0; }

  .final-score{ font-size:15px; color:#9fb6ff; }
  .final-score b{ font-size:40px; color:var(--gold); display:block; text-shadow:0 0 24px rgba(255,215,106,.5); }
  .newrec{ color:var(--gold); font-weight:800; letter-spacing:2px; animation:pulse 1s infinite; }
  @keyframes pulse{ 50%{opacity:.5} }
  .coin-box{ background:rgba(10,16,44,.7); border:1px solid var(--stroke); border-radius:11px; padding:6px 12px; color:var(--gold); font-weight:800; font-size:14px; display:flex; align-items:center; gap:6px; }
  /* 黄色金币图标（HUD / 余额 / 价格标签统一复用） */
  .coin-ic{ position:relative; display:inline-block; width:14px; height:14px; border-radius:50%; flex:none;
    background:radial-gradient(circle at 34% 30%, #fff6c2, #ffd24d 46%, #e0910a 100%);
    box-shadow:0 0 0 1px rgba(150,95,0,.55), 0 0 7px rgba(255,200,60,.55); }
  .coin-ic::after{ content:'¥'; position:absolute; inset:0; display:grid; place-items:center; font-size:10px; font-weight:800; color:#8a5200; line-height:1; }
  /* ===== Hangar / Shop (visual) ===== */
  #hangarScreen{ padding:16px 28px; }
  .hangar-head{ display:flex; align-items:center; justify-content:space-between; width:94%; max-width:440px; margin:2px 0 10px; }
  .hangar-head .coin-box{ font-size:15px; padding:8px 14px; }
  .hangar-scroll{ flex:1 1 auto; min-height:0; width:94%; max-width:440px; overflow:auto; display:flex; flex-direction:column; gap:14px; padding:2px 2px 4px;
    scrollbar-width:none;        /* Firefox：隐藏滚动条 */
    -ms-overflow-style:none;     /* 旧 Edge/IE：隐藏滚动条 */
  }
  .hangar-scroll::-webkit-scrollbar{ width:0; height:0; display:none; }  /* WebKit：隐藏滚动条但保留滚动 */
  .hangar-sec-title{ font-size:13px; font-weight:800; color:#9fb6ff; letter-spacing:2px; text-align:left; margin:2px 2px 0; }
  .hangar-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .hangar-card{ background:rgba(10,16,44,.62); border:1px solid var(--stroke); border-radius:13px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:6px; transition:border-color .15s, box-shadow .15s; }
  .hangar-card.sel{ border-color:var(--neon); box-shadow:0 0 0 2px rgba(34,230,255,.35), 0 0 22px rgba(34,230,255,.16); }
  /* 图鉴标签 */
  .encyclopedia-tabs{ display:flex; gap:8px; margin:4px 0 10px; width:94%; max-width:440px; }
  .encyclopedia-tab{ flex:1; background:rgba(10,16,44,.35); border:1px solid var(--stroke); color:#8fb0ff; border-radius:999px; padding:7px 0; font-size:13px; font-weight:700; cursor:pointer; transition:.15s; text-align:center; }
  .encyclopedia-tab:hover{ border-color:var(--neon); color:#cfe0ff; }
  .encyclopedia-tab.active{ background:rgba(34,230,255,.12); border-color:var(--neon); color:var(--neon); box-shadow:0 0 8px rgba(34,230,255,.25); }
  .hangar-card .thumb{ width:100%; height:70px; }
  /* Boss 图鉴卡片：左图右文 */
  /* Boss 图鉴：左卡片(图) + 右纯文字 */
  .ency-boss{ display:flex; flex-direction:row; align-items:center; gap:14px; width:100%; }
  .ency-boss-left{ background:rgba(10,16,44,.62); border:1px solid var(--stroke); border-radius:13px; padding:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .ency-boss-left .thumb{ width:110px; height:110px; }
  .ency-boss-right{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; text-align:left; }
  .ency-boss-right .nm{ text-align:left; font-weight:800; color:#dbe6ff; font-size:14px; }
  .ency-boss-right .stat{ text-align:left; color:#8fa0d8; font-size:11px; line-height:1.5; }
  .hangar-card .nm{ font-weight:800; color:#dbe6ff; font-size:14px; }
  .hangar-card .stat{ color:#8fa0d8; font-size:11px; text-align:center; min-height:14px; line-height:1.5; }
  /* 机库按钮：统一为主界面「玻璃幽灵胶囊」风格 */
  .hangar-card .act{
    width:100%; margin-top:auto; padding:9px 0; font-size:13px; font-weight:700; letter-spacing:1px;
    border-radius:999px;                                   /* 胶囊，呼应主界面 */
    background:rgba(10,16,44,.45); border:1px solid var(--stroke); color:#cfe0ff;
    box-shadow:none; cursor:pointer; transition:transform .12s, border-color .15s, color .15s, box-shadow .2s;
  }
  .hangar-card .act:hover{ border-color:var(--neon); color:#fff; transform:translateY(-1px); }
  .hangar-card .act:disabled{ opacity:.4; cursor:default; transform:none; }
  /* 已选/激活态：实色青 + 呼吸光晕，对应主界面「就绪」发光语言 */
  .hangar-card .act.ok{ background:linear-gradient(135deg,var(--neon),#4fd6ff); border-color:transparent; color:#04121a; box-shadow:0 0 18px rgba(34,230,255,.5); }
  /* 解锁/升级：金边幽灵胶囊（金币语义），hover 染金光 */
  .hangar-card .act.warn{ background:rgba(10,16,44,.45); border-color:rgba(255,200,80,.55); color:var(--gold); }
  .hangar-card .act.warn:hover{ border-color:var(--gold); color:#fff; box-shadow:0 0 16px rgba(255,200,80,.45); }

<script>
"use strict";
(function(){
  // ============ Setup ============
  const canvas = document.getElementById('game');
  let ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  let W=480, H=860, DPR=Math.min(window.devicePixelRatio||1, 2);

  function resize(){
    const r = wrap.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildNebula();
  }

  // ============ 性能优化：预渲染发光精灵（替代 shadowBlur） ============
  let glowCache={}, enemyHeavyGrad=null;
  function makeGlow(rgba){
    const s=32, c=document.createElement('canvas'); c.width=c.height=s;
    const g=c.getContext('2d');
    const grad=g.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
    grad.addColorStop(0, rgba);
    grad.addColorStop(0.5, rgba.replace(/[\d.]+\)$/,'0.35)'));
    grad.addColorStop(1, rgba.replace(/[\d.]+\)$/,'0)'));
    g.fillStyle=grad; g.fillRect(0,0,s,s);
    return c;
  }
  // 按颜色（rgba 串）惰性生成并缓存发光精灵，供不同颜色子弹复用
  function glowFor(rgba){ if(!glowCache[rgba]) glowCache[rgba]=makeGlow(rgba); return glowCache[rgba]; }
  // hex 颜色转 rgba 字符串（供发光精灵；保证 glowFor 能正确解析透明度）
  function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
  // 插值 / 缓动工具（过场动画用）
  function lerp(a,b,t){ return a+(b-a)*t; }
  function easeOut(t){ return 1-(1-t)*(1-t); }
  function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
  function easeIn(t){ return t*t*t; }    // 三次方缓入：开始极慢，末尾加速
  // Boss 子弹未单独定义样式，统一回退到该默认（粉红能量球）
  const ENEMY_BULLET = { glow:'rgba(255,80,140,0.9)', fill:'#ff5a8c', shape:'orb' };
  function buildSprites(){
    glowCache.cyan  = makeGlow('rgba(34,230,255,0.95)');
    glowCache.gold  = makeGlow('rgba(255,159,59,0.95)');
    glowCache.pink  = makeGlow('rgba(255,84,112,0.95)');
    glowCache.white = makeGlow('rgba(255,255,255,0.95)');
    glowCache.soft  = makeGlow('rgba(200,210,255,0.85)');
    // 重型机体渐变（仅构建一次，避免每帧 createLinearGradient）
    enemyHeavyGrad = ctx.createLinearGradient(0,-28,0,28);
    enemyHeavyGrad.addColorStop(0,'#b06bff'); enemyHeavyGrad.addColorStop(1,'#5a2a9c');
  }

  // 星云预渲染到离屏画布（避免每帧重建渐变）
  let nebCanvas=document.createElement('canvas');
  function buildNebula(){
    nebCanvas.width=W; nebCanvas.height=H;
    const c=nebCanvas.getContext('2d');
    const n1=c.createRadialGradient(W*0.78,H*0.18,10, W*0.78,H*0.18,W*0.8);
    n1.addColorStop(0,'rgba(255,64,160,.20)'); n1.addColorStop(.5,'rgba(190,60,200,.10)'); n1.addColorStop(1,'rgba(255,64,160,0)');
    c.fillStyle=n1; c.fillRect(0,0,W,H);
    const n2=c.createRadialGradient(W*0.16,H*0.80,10, W*0.16,H*0.80,W*0.85);
    n2.addColorStop(0,'rgba(90,80,255,.22)'); n2.addColorStop(.5,'rgba(60,120,255,.10)'); n2.addColorStop(1,'rgba(90,80,255,0)');
    c.fillStyle=n2; c.fillRect(0,0,W,H);
    const n3=c.createRadialGradient(W*0.55,H*0.48,10, W*0.55,H*0.48,W*0.55);
    n3.addColorStop(0,'rgba(40,200,220,.10)'); n3.addColorStop(1,'rgba(40,200,220,0)');
    c.fillStyle=n3; c.fillRect(0,0,W,H);
  }
  window.addEventListener('resize', resize);

  // ============ DOM ============
  const el = id => document.getElementById(id);
  const startScreen=el('startScreen'), overScreen=el('overScreen'), pauseScreen=el('pauseScreen'), hud=el('hud');
  const warpSkip=el('warpSkip'); warpSkip.onclick=skipWarp;   // 过场可跳过（手机端按钮 + 键盘空格/回车）
  const hangarScreen=el('hangarScreen'), hangarList=el('hangarList'), hangarCoins=el('hangarCoins'), hangarBackBtn=el('hangarBackBtn'), hangarMenuBtn=el('hangarMenuBtn');
  const encyclopediaScreen=el('encyclopediaScreen'), encyclopediaList=el('encyclopediaList'), encyclopediaBackBtn=el('encyclopediaBackBtn'), encyclopediaMenuBtn=el('encyclopediaMenuBtn');
  const nickInput=el('nick'), scoreNum=el('scoreNum'), hpFill=el('hpFill'), livesBox=el('lives');

  // ============ Nickname ============
  const NA=['疾风','银翼','暗焰','雷霆','幻影','苍穹','星陨','赤炎','寒鸦','龙渊','夜枭','破晓','烈阳','虚空','钢铁','极光'];
  const NB=['射手','游侠','舰长','猎鹰','先锋','刺客','守望','风暴','骑士','战狼','特工','王牌'];
  const randNick=()=> NA[Math.random()*NA.length|0]+NB[Math.random()*NB.length|0]+(Math.random()*90+10|0);
  // 主界面昵称：可点胶囊，点击弹出修改弹窗（不直接在主界面显示输入框）
  const nickChip=el('nickChip'), nickModal=el('nickModal'), nickNameEl=el('nickName');
  const nickCancel=el('nickCancel'), nickSave=el('nickSave');
  function syncNick(){ nickNameEl.textContent = (nickInput.value.trim()||'飞行员'); }
  function openNickModal(){ nickModal.classList.remove('hidden'); nickInput.focus(); nickInput.select(); }
  function closeNickModal(){ nickInput.value=nickNameEl.textContent; nickModal.classList.add('hidden'); }
  function saveNick(){ syncNick(); closeNickModal(); }
  nickChip.onclick=openNickModal;
  nickCancel.onclick=closeNickModal;
  nickSave.onclick=saveNick;
  el('diceBtn').onclick=()=>{ nickInput.value=randNick(); };
  nickInput.value = randNick();
  syncNick();                                   // 初始随机昵称同步到胶囊显示

  // ============ Leaderboard ============
  const LB_KEY='starfighter_leaderboard_v1';
  const loadLB=()=>{ try{ return JSON.parse(localStorage.getItem(LB_KEY))||[] }catch(e){ return [] } };
  const saveLB=(arr)=> localStorage.setItem(LB_KEY, JSON.stringify(arr.slice(0,10)));
  function addScore(name, score){
    const lb=loadLB();
    const entry={name,score,ts:Date.now()};
    lb.push(entry); lb.sort((a,b)=>b.score-a.score);
    const top=lb.slice(0,10); saveLB(top);
    return {rank: top.indexOf(entry), list: top, entry};
  }
  function renderLB(highlightTs){
    const lb=loadLB(); const ol=el('rankList');
    if(!lb.length){ ol.innerHTML='<div class="empty">暂无记录，成为第一名吧！</div>'; return; }
    ol.innerHTML = lb.map((e,i)=>{
      const cls=['','top1','top2','top3'][i+1]||'';
      const me = e.ts===highlightTs ? 'me':'';
      return `<li class="${cls} ${me}"><span class="no">${i+1}</span><span class="nm">${escapeHtml(e.name)}</span><span class="sc">${e.score}</span></li>`;
    }).join('');
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  el('clearBtn').onclick=()=>{ if(confirm('确定清空排行榜？')){ localStorage.removeItem(LB_KEY); renderLB(); } };

  // ============ Save (meta progression) ============
  const SAVE_KEY='starfighter_save_v1';
  function loadSave(){ try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); if(s&&typeof s==='object') return Object.assign({coins:0,atkLv:0,streamBase:1,wingType:null,ownedSkins:['vanguard'],startLives:3,maxLives:6,items:{bomb:0,shield:0,invinc:0}}, s); }catch(e){} return {coins:0,atkLv:0,streamBase:1,wingType:null,ownedSkins:['vanguard'],startLives:3,maxLives:6,items:{bomb:0,shield:0,invinc:0}}; }
  function saveSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
  let save=loadSave();
  let maxLives=save.maxLives;   // 命数硬上限（商店可放宽）
  const MAX_LIVES_CAP=9;    // 生命上限最高可购买到的硬顶（商店放宽上限不得超过此值）
  let invItems={ bomb:0, shield:0, invinc:0, shieldHits:0 };  // 本局道具库存（shieldHits=护盾剩余吸收次数）
  let coinsRun=0;   // 本局已拾取金币（gameOver 结算入 save.coins）

  // ============ Game State ============
  const State={ MENU:'menu', PLAY:'play', PAUSE:'pause', OVER:'over', HANGAR:'hangar', ENCYCLOPEDIA:'encyclopedia', WARP:'warp' };
  let state=State.MENU;
  let player, bullets, enemies, eBullets, particles, stars, planets, meteors, motes;
  let warpT=0, warpParts=[], warpStreaks=[], hx=0, hy=0, warpMode='normal', collapseStartX=0, collapseStartY=0;   // 过场动画（黑洞跳跃 | Boss 塌缩吸入）状态
  const WARP={ total:220, holeOpen:34, inEnd:130, flashEnd:165, outEnd:205 };  // 正常跃迁各阶段帧位（60Hz 固定步长，≈3.7s）
  const WARP_BOSS={ holeOpen:70, inEnd:160, outEnd:210, total:240 };  // Boss 塌缩跃迁：洞张开→吸入舰船→底部飞出→下一关（≈4s）
  let score, maxHP, hp, lives, tick=0, spawnTimer, diffMul, playerName, invuln, invincT=0, meteorTimer=0;
  let powerups=[], coins=[], spreadT=0, wingmen=[], wingBoostT=0, lastStream=1, toastT=0, toastText='', laserPhase=0;

let victoryT=0, victoryHX=0, victoryHY=0;   // 胜利缓冲：Boss 死亡后停留帧 / 黑洞诞生坐标
let furyT=0, furyStack=0;               // 突击者被动：连杀计时 / 层数
let phaseDodgeCD=0;                     // 幻影被动：闪避内置冷却
let armorT=0, armorCD=0;                // 泰坦被动：减伤计时 / 冷却
let slowFactor=1, slowEnemyFactor=1;    // 夜莺大招：时缓倍率（默认=不减速）
let overloadCount=0;                    // 脉冲被动：过载射击计数器

// ============ 被动钩子（4 个系统触发点：射速 / ���杀 / 闪避 / 受伤） ============
// 新增被动类型 = 在对应钩子加一个分支；如无此触发点则不碰
function hookFireCool(skin, cool){
  if(skin.passive?.type==='rapidFire') cool=Math.round(cool*0.85);
  if(skin.passive?.type==='fury' && furyStack>0) cool=Math.round(cool/(1+0.2*furyStack));
  if(skin.ultimate?.type==='overdrive' && ultActive) cool=Math.round(cool*0.5);
  return cool;
}
function hookEnemyKill(skin){
  if(skin.passive?.type==='fury'){ const s=furyStack; furyStack=Math.min(3, furyStack+1); furyT=90; if(furyStack!==s) showToast('🔥 连杀 ×'+furyStack); }
  if(skin.passive?.type==='lifeSteal') hp=Math.min(maxHP, hp+3);
}
function hookBulletHit(skin, x, y){
  if(skin.passive?.type==='phaseDodge' && phaseDodgeCD<=0 && Math.random()<0.15){
    phaseDodgeCD=240; invuln=40; explode(x,y,'#b06bff',16,5); showToast('✨ 闪避'); return true;
  }
  return false;
}
function hookPlayerHit(skin, dmg){
  if(skin.passive?.type==='armor'){
    if(armorT>0){ dmg=Math.round(dmg*0.5); armorT=0; armorCD=300; }
    if(armorCD<=0) armorT=30;
  }
  return dmg;
}

// ============ 被动名称映射 ============

  function initOrbs(){
    const R=170, margin=2, orbR=48;        // 大圆半径 / 边框 / 小圆半径
    const inner=R-margin-orbR;               // 小圆圆心可活动半径
    const mk=id=>({ el:el(id), x:0, y:0, vx:0, vy:0, r:orbR, paused:false });
    const a=mk('startBtn'), b=mk('bossRushBtn');
    a.x=R-inner*0.55; a.y=R-12; a.vx= 0.30; a.vy= 0.20;   // 初始：水平并排，战役略高；极慢初速度（碰撞柔和）
    b.x=R+inner*0.55; b.y=R+12; b.vx=-0.26; b.vy=-0.22;
    menuOrbs=[a,b];
    for(const o of menuOrbs){
      o.el.addEventListener('mouseenter',()=>o.paused=true);   // 悬停暂停，方便点中
      o.el.addEventListener('mouseleave',()=>o.paused=false);
    }
    orbsReady=true;
  }
  function updateOrbs(){
    if(!orbsReady) initOrbs();
    const R=170, margin=2, orbR=48, inner=R-margin-orbR;
    for(const o of menuOrbs){
      if(!o.paused){ o.x+=o.vx; o.y+=o.vy; }
      const dx=o.x-R, dy=o.y-R, d=Math.hypot(dx,dy);   // 大圆内壁反弹
      if(d>inner){
        const nx=dx/(d||1), ny=dy/(d||1);
        o.x=R+nx*inner; o.y=R+ny*inner;
        const vn=o.vx*nx+o.vy*ny; o.vx-=2*vn*nx; o.vy-=2*vn*ny;
      }
      o.el.style.left=(o.x-orbR)+'px';
      o.el.style.top =(o.y-orbR)+'px';
    }
    const [a,b]=menuOrbs;                                // 圆-圆弹性碰撞（等质量沿法线交换）
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.001, minD=a.r+b.r;
    if(d<minD){
      const nx=dx/d, ny=dy/d, overlap=(minD-d)/2;
      a.x-=nx*overlap; a.y-=ny*overlap; b.x+=nx*overlap; b.y+=ny*overlap;
      const va=a.vx*nx+a.vy*ny, vb=b.vx*nx+b.vy*ny, diff=vb-va;
      a.vx+=diff*nx; a.vy+=diff*ny; b.vx-=diff*nx; b.vy-=diff*ny;
    }
  }

  // 缩略图基类：按 DPR 建高清画布并清空，返回 {g,w,h}（CSS 像素坐标系）。HANGAR 态主循环不跑，安全。
  function prepThumb(cv){
    const T=CONFIG.ui.thumb;
    const r=(cv.getBoundingClientRect && cv.getBoundingClientRect().width) ? cv.getBoundingClientRect() : null;
    const w=r?r.width:T.w, h=r?r.height:T.h;
    const dpr=Math.min(window.devicePixelRatio||1, T.dprMax);
    cv.width=Math.max(1, Math.round(w*dpr));
    cv.height=Math.max(1, Math.round(h*dpr));
    const g=cv.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);
    g.clearRect(0,0,w,h);
    return { g, w, h };
  }
  // 战机缩略图：缩放居中绘制，避免小画布被拉伸成马赛克
  function drawSkinThumb(cv, skinFn){
    const { g, w, h }=prepThumb(cv);
    const T=CONFIG.ui.thumb;
    const savedCtx=ctx, hadP=player, ti=tick, iv=invuln;
    const s=Math.min(w*T.pad/(2*T.planeHalfW), h*T.pad/(2*T.planeHalfH));
    const cx=w/2, cy=h*T.cy;
    player={x:cx, y:cy}; tick=4; invuln=0; ctx=g;
    try{
      g.save(); g.translate(cx,cy); g.scale(s,s); g.translate(-cx,-cy);
      skinFn();
      g.restore();
    } finally { ctx=savedCtx; player=hadP; tick=ti; invuln=iv; }
  }
  // 僚机预览：画出「上方选中的战斗机」+ 两侧僚机效果（与战斗 drawWingmen 一致）
  function drawPlaneWingThumb(cv, skinFn, wt){
    const { g, w, h }=prepThumb(cv);
    const T=CONFIG.ui.thumb;
    const savedCtx=ctx, hadP=player, ti=tick, iv=invuln;
    const s=Math.min(w*T.pad/(2*T.planeHalfW), h*T.pad/(2*T.planeHalfH));
    const cx=w/2, cy=h*T.cy;
    player={x:cx, y:cy}; tick=4; invuln=0; ctx=g;
    try{
      g.save(); g.translate(cx,cy); g.scale(s,s); g.translate(-cx,-cy);
      skinFn();                                       // 选中的战斗机
      for(const side of [-1,1]){                       // 两侧僚机效果（按型号绘制，与实战一致）
        g.save(); g.translate(cx + side*CONFIG.player.wingOffset, cy+10);
        g.shadowColor=wt.color; g.shadowBlur=12;
        (wt.draw||drawWingGunner)(wt.color);
        g.restore();
      }
      g.restore();
    } finally { ctx=savedCtx; player=hadP; tick=ti; invuln=iv; }
  }

  }
  // 战斗左侧道具使用面板：遍历注册表中 kind==='consume' 的项，shared 项复用掉落 handler，独有项用自身 battleUse
  const itemPanel=el('itemPanel');

      const def=ITEMS[key];
      if(def.kind!=='consume') continue;            // 仅消耗品进战斗面板（生命基数/上限为永久增益，不在此列）
      const t=def.shared?CONFIG.powerups.types[def.shared]:null;
      const use = t ? ()=>CONFIG.powerups.handlers[key]() : def.battleUse;   // 同源→复用掉落 handler；独有→自身 battleUse
      const ic  = t ? t.label : def.icon;          // 同源项图标与掉落 label 一致

      const active = key==='shield' && invItems.shieldHits>0;

      b.title='点击使用';

        if(key==='shield' && invItems.shieldHits>0){ showToast('护盾已生效 · 剩余 '+invItems.shieldHits+' 次'); renderItemPanel(); return; }
        use(); renderItemPanel();
      };

  }
  const lifeSVG=()=>'<svg class="life" viewBox="0 0 24 24"><path fill="#ff4d6d" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

  // ============ Entities ============
  // 攻击力倍率（机库升级 atkLv，每级 +atkPerLv）
  function atkMul(){ return 1 + CONFIG.player.atkPerLv*(save?save.atkLv:0); }
  // 基础火力束数：分数档(1→5) + 机库 streamBase 永久抬基底，封顶 5（保留分数涨火力手感）
  function streamLevel(){ const t=CONFIG.player.stream; let passed=0; for(const th of t) if(score>=th) passed++; return Math.min(t.length+1, 1 + passed + (save?save.streamBase:0)); }
  let notifyTimer=null;
  function notify(msg){ const n=el('notify'); if(!n) return; n.textContent=msg; n.classList.add('show'); if(notifyTimer) clearTimeout(notifyTimer); notifyTimer=setTimeout(()=>{ n.classList.remove('show'); }, 1600); }
  function showToast(t){ toastT=90; toastText=t; }
  // 怒气累计（受 enabled 开关与上限约束；优先用皮肤自己的配置）
  function addRage(v){
    if(!CONFIG.player.ultimate.enabled) return;
    const skU={...CONFIG.player.ultimate, ...(getSkin(player.skin).ultimate||{})};
    const m=skU.max;
    if(rage<m) rage=Math.min(m, rage+v);
  }
  function triggerUltimate(){
    const sk=getSkin(player.skin);
    const U={...CONFIG.player.ultimate, ...(sk.ultimate||{})};
    if(!U.enabled || ultActive || rage < U.max) return;
    ultActive=true; ultT=U.dur; rage=0; invuln=Math.max(invuln, 16);
    showToast(sk.name+' · '+getUltName(U.type));
    // 瞬间型大招在此执行效果
    switch(U.type){
      case 'nova':  // 幻影·虚空新星
        for(const e of enemies) e.hp-=Math.round(e.maxhp*U.novaDmg);
        eBullets.length=0;
        for(let i=0;i<36;i++) explode(player.x, player.y-10, '#b06bff', 60, 8);
        break;
      case 'shield': // 泰坦·护盾冲击
        eBullets.length=0;
        for(let i=0;i<20;i++) explode(player.x, player.y-10, '#ffd76a', 40, 6);
        invincT=Math.max(invincT, U.shieldDur);
        hp=Math.min(maxHP, hp+Math.round(maxHP*U.healFrac));
        break;
      case 'slow':   // 夜莺·时缓领域
        slowFactor=0.4; slowEnemyFactor=0.6;
        break;
      case 'overdrive': // 脉冲·超载模式
        break;
    }
    for(let i=0;i<26;i++) explode(player.x, player.y-10, '#ffb13b', 26, 7);
  }
  function fireBullet(){
    const sl=streamLevel(), m=atkMul(), sk=getSkin(player.skin).bullet;
    for(const s of CONFIG.player.streams[sl-1]) bullets.push({x:player.x+s.dx, y:player.y+s.dy, w:s.w, h:s.h, vy:s.vy, dmg:s.dmg*m, glow:sk.glow, fill:sk.fill, shape:sk.shape});
    if(spreadT>0) for(const s of CONFIG.player.spreadBonus) bullets.push({x:player.x+s.dx, y:player.y+s.dy, w:s.w, h:s.h, vy:s.vy, dmg:s.dmg*m, glow:sk.glow, fill:sk.fill, shape:sk.shape});
    // 脉冲被动：过载射击（每 5 发射 1 发 1.5 倍穿透弹）
    if(getSkin(player.skin).passive?.type==='overload'){
      overloadCount=(overloadCount+1)%5;
      if(overloadCount===0) for(const s of CONFIG.player.streams[sl-1]) bullets.push({x:player.x+s.dx, y:player.y+s.dy, w:s.w, h:s.h, vy:s.vy, dmg:Math.round(s.dmg*m*1.5), glow:sk.glow, fill:sk.fill, shape:sk.shape});
    }
  }
  // 金币掉落（击杀敌机/Boss）：靠近磁吸，碰到即计入本局 coinsRun
  function spawnCoin(x,y,value){ coins.push({x:x+(Math.random()*20-10), y, vy:1.4, value, t:Math.random()*6}); }
  function drawCoins(){

      ctx.shadowBlur=0; ctx.fillStyle='#fff3b0'; ctx.beginPath(); ctx.arc(-1.6,-1.6,2.3,0,7); ctx.fill();

  function pickEnemy(pool){
    if(!pool) pool=enemyPool();
    let total=0; for(const d of pool) total+=d.weight;   // 权重相对化，适应不同关卡池
    let r=Math.random()*total;
    for(const def of pool){ r-=def.weight; if(r<=0) return def; }
    return pool[pool.length-1]||CONFIG.enemies.heavy;
  }
  function spawnEnemy(){
    const p=prog(), spd=1+p*CONFIG.difficulty.enemySpeedK;   // 移速倍率 1.0→2.2
    const cd=1-p*CONFIG.difficulty.coolK;                     // 射击冷却倍率 1.0→0.4
    const def=pickEnemy();
    const x = Math.max(60, Math.min(W-60, Math.random()*(W-def.spawn.pad)+def.spawn.pad/2));
    enemies.push({
      type:def.key,
      x, baseX: def.move ? x : 0,   // 自定义移动（蛇形等）以 baseX 为基准横移
      y: def.spawn.y,
      w:def.w, h:def.h, hp:def.hp, maxhp:def.hp,
      vy:def.vy*spd, vx: def.vx ? (Math.random()<.5?-1:1)*def.vx : 0,
      score:def.score, cool:def.coolInit(cd),
    });
  }
  function enemyShoot(e){
    const def=CONFIG.enemies[e.type], b=def.bullet, bs=1+prog()*CONFIG.difficulty.bulletK;
    if(!b) return;                               // 无子弹（陨石）：不射击
    if(b.spread){                               // 扇形散射（heavy/turret 等）
      for(let a=-((b.spread-1)/2);a<=((b.spread-1)/2);a++) eBullets.push({x:e.x, y:e.y+e.h/2, w:b.w, h:b.h, vy:b.vy*bs, vx:a*b.spreadVx, dmg:b.dmg, glow:b.glow, fill:b.fill, shape:b.shape});
    } else {
      eBullets.push({x:e.x, y:e.y+e.h/2, w:b.w, h:b.h, vy:b.vy*bs, vx:0, dmg:b.dmg, glow:b.glow, fill:b.fill, shape:b.shape});
    }
  }
  function explode(x,y,color,n=18,spd=4){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=Math.random()*spd+1;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,r:Math.random()*3+1.5});

  // ============ 道具掉落（参数见 CONFIG.powerups） ============
  function spawnPowerup(x,y, force){
    let t=force;
    if(!t){ const r=Math.random(); for(const w of CONFIG.powerups.spawnWeights){ if(r<w.max){ t=w.t; break; } } }
    powerups.push({x, y, vy:1.7, type:t, r:14, t:0});
  }
  function applyPowerup(p){
    const h=CONFIG.powerups.handlers[p.type];
    if(h) h(p);                       // 效果由 handlers 映射分发，新增奖励只加一条

  // ============ Levels & Boss ============
  function startLevel(n){
    const ld=levelDef(n);
    const P=CONFIG.player;
    enemies.length=0; eBullets.length=0; ultActive=false; ultT=0;   // 清掉上一关（尤其 Boss 战）残留的小兵、弹幕与大招，避免带进下一关
    bullets=[]; particles=[]; powerups=[]; coins=[];   // 清掉残留的玩家子弹 / 粒子 / 掉落的道具与金币（宽限未拾完的不拖到下一关）
    level=n; kills=0;
    if(gameMode==='bossrush'){
      killQuota=0;   // 跳过波次，首帧直接出 Boss
      bannerText='BOSS战 · 第 '+n+'/'+CONFIG.levels.max+' 关';
      if(n>1) hp=Math.min(maxHP, hp+Math.round(maxHP*0.5));   // 关间回复 50% 血量（命数不变）
    } else {
      killQuota=ld.quota(n); bannerText='第 '+n+' 关';
    }
    boss=null; bannerT=CONFIG.levels.bannerT;
    player.x=W/2; player.y=H-P.startYOffset; player.tx=player.x; player.ty=player.y;   // 每关起始终点一致，不依赖跃迁动画的副作用
  }
  function spawnBoss(){
    const cfg=CONFIG.boss, ld=levelDef(level);
    let arch=(level-1)%cfg.archs.length;               // 默认按关卡循环
    if(ld.bossArch){ const i=cfg.archs.findIndex(a=>a.id===ld.bossArch); if(i>=0) arch=i; }  // 或按关指定
    const A=cfg.archs[arch];
    const pick=(fn,fallback)=> (A[fn]? A[fn](level) : fallback(level));  // 逐原型可选覆盖，否则回退全局
    const hp=pick('hp', cfg.hp);
    boss={
      arch, name:A.name+' Lv.'+level,
      x:W/2, y:cfg.baseY, w:A.w||cfg.w, h:A.h||cfg.h,
      hp, maxhp:hp,
      cool:cfg.cool, minionCool:cfg.minionCool, phase:0,
      bSpd:pick('bSpd', cfg.bSpd), entering:true,
      score:pick('score', cfg.score),
      phaseTh: A.phase || cfg.phase,        // 阶段阈值（可逐原型覆盖）
      dropCfg: A.drop || cfg.drop,          // 掉落节奏（可逐原型覆盖）
      minionCfg: A.minion || cfg.minion,    // 召唤节奏（可逐原型覆盖）
      summon: !!A.summon,
      color:A.color, glow:hexA(A.color,0.9), fill:A.color,   // 子弹跟随机身原型配色
      rings:[], flash:0, phaseRot:0, spiral:0,
      dropCool:cfg.dropCool  // Boss 战中周期性随机掉落奖励
    };

  }
  function enterBossPhase(p){
    boss.phase=p; boss.cool=Math.max(18,boss.cool); boss.flash=26;
    boss.rings.push({r:24,life:1});
  }
  function bossShoot(){ const A=CONFIG.boss.archs[boss.arch], P=CONFIG.boss.patterns; for(let ph=0;ph<=boss.phase;ph++){ const list=A.patterns[ph]; if(!list) continue; for(const {fn,p} of list) P[fn](boss,p); } }
  function updateBoss(){
    const b=boss, BC=CONFIG.boss;
    if(b.entering){ b.y+=2; if(b.y>=BC.enterY) b.entering=false; return; }
    // 阶段切换（阈值可逐原型覆盖）
    const frac=b.hp/b.maxhp;
    if(b.phase===0 && frac<=b.phaseTh[0]) enterBossPhase(1);
    else if(b.phase===1 && frac<=b.phaseTh[1]) enterBossPhase(2);
    // 移动
    b.x = W/2 + Math.sin(tick*0.012)*(W/2-100);
    // Boss 战中随机掉落奖励（阶段越高越频繁）
    b.dropCool--;
    if(b.dropCool<=0){ spawnPowerup(b.x + (Math.random()*40-20), b.y+40); const DC=b.dropCfg; b.dropCool = Math.max(DC.min, DC.base - b.phase*DC.step); }
    // 冲击波环 / 闪光衰减
    for(let i=b.rings.length-1;i>=0;i--){ const r=b.rings[i]; r.r+=5; r.life-=0.03; if(r.life<=0) b.rings.splice(i,1); }
    if(b.flash>0) b.flash--;
    // 射击（阶段越高越快）
    b.cool--;
    if(b.cool<=0){ bossShoot(); b.cool=Math.max(26, 84-level*4) - b.phase*10; }
    // 召唤小兵（阶段越高越频繁；由 b.summon 控制，不限于某原型）
    if(b.summon){
      b.minionCool--;
      if(b.minionCool<=0 && enemies.length<4+b.phase){
        const sc=CONFIG.enemies.scout, MC=b.minionCfg;
        enemies.push({type:'scout', x:b.x+(Math.random()<.5?-70:70), y:b.y+40, w:sc.w, h:sc.h, hp:sc.hp, maxhp:sc.hp, vy:1.6, vx:0, score:sc.score, cool:MC.enemyCool});
        b.minionCool=Math.max(MC.min, MC.base - level*MC.lvK - b.phase*MC.phaseK);
      }
    }
    // 玩家子弹打 Boss
    for(let j=bullets.length-1;j>=0;j--){
      const bl=bullets[j];
      if(Math.abs(bl.x-b.x)<b.w/2 && Math.abs(bl.y-b.y)<b.h/2){
        b.hp-=bl.dmg; bullets.splice(j,1);
        explode(bl.x,bl.y,'#ffd76a',4,2.5);
      }
    }
    // 撞击玩家
    if(invuln<=0 && invincT<=0 && Math.abs(b.x-player.x)<(b.w/2+14) && Math.abs(b.y-player.y)<(b.h/2+16)) hitPlayer(BC.contactDmg);
    // Boss 死亡 → 过关
    if(b.hp<=0){
      score+=b.score;
      for(let i=0;i<6;i++) explode(b.x+(Math.random()-.5)*b.w, b.y+(Math.random()-.5)*b.h, ['#ffb14d','#ff6a8a','#ffd76a','#c05cff'][i%4], 26, 6);
      let bt; { const r=Math.random(); for(const w of CONFIG.powerups.bossDrop){ if(r<w.max){ bt=w.t; break; } } }
      spawnPowerup(b.x, b.y, bt);
      const total=Math.max(20, Math.round(b.score/4));   // Boss 掉一大笔金币
      for(let i=0;i<10;i++) spawnCoin(b.x+(Math.random()*120-60), b.y+(Math.random()*40-20), Math.max(2, Math.round(total/10)));
      boss=null; eBullets.length=0; enemies.length=0; ultActive=false; ultT=0; updateHUD();
      if(level>=CONFIG.levels.max){ won=true; gameOver(); }
      else { victoryT=180; victoryHX=b.x; victoryHY=b.y; }
    }
  }

  // ============ Update ============
  function update(){
    tick++;
    diffMul = 1 + prog()*D.enemySpeedK;   // 难度倍率（分数+关卡双驱动）：移速/敌弹/星空滚动沿用
    if(bannerT>0) bannerT--;
    if(toastT>0) toastT--;
    // Boss 清场后的「拾取宽限」：掉落的金币/道具未拾完不进过场；超时也强制进入
    // 仅触发过场判定，玩家移动与拾取仍由下方常规逻辑处理
    const sl=streamLevel();
    if(sl>lastStream){ lastStream=sl; showToast('🔥 火力提升至 '+sl+' 束'); }

    // space background (stars + meteors)
    updateSpace();

    // player movement（键盘灵敏度下调，避免一按就窜太远）
    // 键盘：直接驱动位置（无惯性、松手即停），便于精准微操
    const A=CONFIG.arena, P=CONFIG.player;
    const kL=keys['arrowleft']||keys['a'], kR=keys['arrowright']||keys['d'],
          kU=keys['arrowup']||keys['w'], kD=keys['arrowdown']||keys['s'];
    if(kL||kR||kU||kD){
      const step=P.keyboardStep, dx=(kR?1:0)-(kL?1:0), dy=(kD?1:0)-(kU?1:0), len=Math.hypot(dx,dy)||1;
      player.x+=dx/len*step; player.y+=dy/len*step;
      player.x=Math.max(A.marginX,Math.min(W-A.marginX,player.x));
      player.y=Math.max(A.marginTop,Math.min(H-A.marginBottom,player.y));
      player.tx=player.x; player.ty=player.y;   // 同步，松开后不回弹
    } else {
      // 鼠标/触摸：平滑跟随
      player.x+=(player.tx-player.x)*P.mouseLerp;
      player.y+=(player.ty-player.y)*P.mouseLerp;
    }
    // 边界限制：无论键盘还是鼠标/触摸，战机始终完整留在画面内
    player.x = Math.max(A.marginX, Math.min(W-A.marginX, player.x));
    player.y = Math.max(A.marginTop, Math.min(H-A.marginBottom, player.y));

    // auto fire（射速随分数提升：14帧/发 → 7帧/发）
    if(player.cool<=0){
      fireBullet();
      let baseCool=Math.round(D.fireBase-prog()*D.fireK);
      baseCool=hookFireCool(getSkin(player.skin), baseCool);
      player.cool=baseCool;
    } else player.cool--;
    if(invuln>0) invuln--;
    // 被动计时衰减
    if(furyT>0){ furyT--; if(furyT<=0) furyStack=0; }
    if(phaseDodgeCD>0) phaseDodgeCD--;
    if(armorT>0) armorT--;
    if(armorCD>0) armorCD--;

    // bullets
    for(let i=bullets.length-1;i>=0;i--){ const b=bullets[i];
      if(b.homing){
        if(b.arm>0){ b.arm--; }                       // 直飞蓄力期：暂不制导
        else {
          b.homeT=(b.homeT||0)+1;
          const canHome = b.homeT <= (b.homeLife||45);   // 制导寿命内才追踪，过期后直线飞走
          // 目标失效（死亡/离场/Boss 倒下）才重新锁定，否则维持原 target（不再每帧抢全场最近）
          if(b.target){
            const gone = (b.target===boss) ? (boss.hp<=0) : (b.target.hp<=0 || enemies.indexOf(b.target)<0);
            if(gone) b.target=null;
          }
          if(!b.target){
            let best=null, bd=1e9;
            for(const e of enemies){ const dx=e.x-b.x, dy=e.y-b.y, d=dx*dx+dy*dy; if(d<bd){bd=d;best=e;} }
            if(best) b.target=best; else if(boss&&boss.hp>0) b.target=boss;
          }
          if(b.target && canHome){
            const dx=b.target.x-b.x, dy=b.target.y-b.y, LR=b.lockRange||220;
            if(dx*dx+dy*dy <= LR*LR){               // 仅在锁定范围内才转向追踪，超出则保持直线（可打空）
              const ang=Math.atan2(dy,dx);
              const sp=b.sp||4, turn=b.turn||0.08;
              const cur=Math.atan2(b.vy, (b.vx||0)||1e-6);
              let na=cur + Math.max(-turn, Math.min(turn, ang-cur));   // 限速转向（画弧、可被打空）
              b.vx=Math.cos(na)*sp; b.vy=Math.sin(na)*sp;
            }
          }
        }
      }
      b.y+=b.vy; b.x+=(b.vx||0); if(b.y<-20||b.x<-20||b.x>W+20) bullets.splice(i,1);
    }

    // 道具掉落：限时增益衰减 + 拾取 + 僚机开火
    if(spreadT>0) spreadT--;
    if(wingBoostT>0) wingBoostT--;   // 僚机为永久装备，wingBoostT 仅表示"临时强化"剩余时间
    if(invincT>0) invincT--;
    for(let i=powerups.length-1;i>=0;i--){
      const p=powerups[i]; p.y+=p.vy; p.t+=0.1;
      if(victoryT>0 && victoryT<=120){ const dx=player.x-p.x, dy=player.y-p.y, d=Math.hypot(dx,dy)||1; p.x+=dx/d*7; p.y+=dy/d*7; }
      if(p.y>H+20){ powerups.splice(i,1); continue; }
      if(Math.abs(p.x-player.x)<20 && Math.abs(p.y-player.y)<24){
        applyPowerup(p); powerups.splice(i,1);
      }
    }
    // 金币：下落 + 靠近磁吸 + 拾取
    for(let i=coins.length-1;i>=0;i--){
      const c=coins[i]; c.y+=c.vy; c.t+=0.12;
      if(c.y>H+20){ coins.splice(i,1); continue; }
      const dx=player.x-c.x, dy=player.y-c.y, d=Math.hypot(dx,dy);
      if(d<90||(victoryT>0&&victoryT<=120)){ c.x+=dx/d*((victoryT>0&&victoryT<=120)?9:4); c.y+=dy/d*((victoryT>0&&victoryT<=120)?9:4); }   // 磁吸 + 胜利自动拾取
      if(d<20){ coinsRun+=c.value; explode(c.x,c.y,'#ffd54a',4,2); coins.splice(i,1); updateHUD(); }
    }
    const atk=atkMul(), boost=wingBoostT>0?1.6:1;
    // 激光僚机：左右同步的脉冲相位（一起发射，频率较低）
    const LB=CONFIG.player.wingTypes.laser.beam;
    laserPhase=(laserPhase+1)%(LB.on+LB.off);
    const laserOn=laserPhase<LB.on;
    for(const w of wingmen){
      const wt=CONFIG.player.wingTypes[w.type]||CONFIG.player.wingTypes.gunner;
      if(wt.beam){
        // 激光僚机：单次脉冲 · 命中即止（hitscan 模型）——光束尾部碰到敌机即造成一次离散伤害并停在敌机处
        if(!w.beam) w.beam={active:false, tipY:null, hit:false};
        w.beam.active=laserOn;
        if(laserOn){
          const bx=player.x + w.side*CONFIG.player.wingOffset;
          const muzzleY=player.y+6;
          if(w.beam.tipY==null){
            // 新脉冲：沿本列向上找最近的敌机，光束尾部停在其处并施加一次离散伤害
            let hitY=0;                                   // 默认延伸到屏幕顶
            let nearest=null, nd=Infinity;
            for(const e of enemies){
              if(Math.abs(e.x-bx) < wt.beam.w/2 + e.w/2){
                const ey=e.y+e.h/2;
                if(ey<muzzleY && muzzleY-ey<nd){ nd=muzzleY-ey; nearest=e; }
              }
            }
            const dmg=wt.beam.dmg*atk*boost;
            if(nearest){
              nearest.hp-=dmg; hitY=nearest.y+nearest.h/2;
              if(nearest.hp<=0){
                const necgf=CONFIG.enemies[nearest.type];
                score+=nearest.score; kills++; explode(nearest.x,nearest.y, necgf?.explodeColor||'#ff6a8a', necgf?.explodeSize||20, 5);
                if(Math.random()<CONFIG.powerups.enemyDrop) spawnPowerup(nearest.x, nearest.y);
                if(Math.random()<CONFIG.powerups.coinDrop) spawnCoin(nearest.x, nearest.y, Math.max(2, Math.round(nearest.score/8)));
                enemies.splice(enemies.indexOf(nearest),1); updateHUD();
              }
            }
            // Boss：列内则造成一次比例伤害，光束尾部停在 Boss 下沿
            if(boss && Math.abs(boss.x-bx) < wt.beam.w/2 + boss.w/2){
              boss.hp=Math.max(0, boss.hp - boss.maxhp*wt.beam.bossDmg);
              if(boss.y+boss.h/2 < muzzleY) hitY=Math.min(hitY, boss.y+boss.h/2);
            }
            w.beam.tipY=hitY;
            w.beam.hit=!!(nearest || (boss && Math.abs(boss.x-bx) < wt.beam.w/2 + boss.w/2));
          }
        } else {
          w.beam.tipY=null; w.beam.hit=false;
        }
      } else {
        w.cool--;
        if(w.cool<=0){
          if(wt.spread){  // 扇形散射（火神）
            const spread=wt.spread, sx=player.x + w.side*CONFIG.player.wingOffset;
            for(let i=0;i<spread;i++){
              const ang=(i-(spread-1)/2)* (wt.spreadVx||0.8);
              bullets.push({x:sx, y:player.y+6, w:wt.w, h:wt.h, vx:Math.sin(ang)*1.5, vy:wt.vy, dmg:wt.dmg*atk*boost, glow:wt.bullet.glow, fill:wt.bullet.fill, shape:wt.bullet.shape});
            }
          } else {
            bullets.push({x:player.x + w.side*CONFIG.player.wingOffset, y:player.y+6, w:wt.w, h:wt.h, vx:0, vy:wt.vy, arm:wt.arm||0, target:null, homeT:0, sp:wt.sp||6, turn:wt.turn||0.15, lockRange:wt.lockRange||220, homeLife:wt.homeLife||45, dmg:wt.dmg*atk*boost, homing:wt.homing, glow:wt.bullet.glow, fill:wt.bullet.fill, shape:wt.bullet.shape});
          }
          w.cool=wt.cool;
        }
      }
    }

    // spawn / 关卡推进
    if(boss){
      updateBoss();
    } else if(victoryT>0){
      victoryT--;
      if(victoryT===60) showToast('开始跃迁');
      if(victoryT<=0){
        collapseStartX=player.x; collapseStartY=player.y;
        hx=victoryHX; hy=victoryHY;
        warpMode='boss';
        startWarp();
      }
    } else if(state===State.PLAY && kills>=killQuota){
      if(enemies.length===0) spawnBoss();   // 清完场再出 Boss
    } else if(state===State.PLAY){
      spawnTimer--;
      if(spawnTimer<=0){ spawnEnemy(); spawnTimer=Math.max(D.spawnMin, Math.round(D.spawnBase-prog()*D.spawnDecay)); }
    }

    // enemies
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      const em=CONFIG.enemies[e.type].move;
      if(em) em(e);                                   // 自定义移动（蛇形/俯冲等）
      else { e.y+=e.vy*slowEnemyFactor; e.x+=e.vx*slowEnemyFactor; if(e.x<e.w/2||e.x>W-e.w/2) e.vx*=-1; }  // 默认直线+反弹
      e.cool--; if(e.cool<=0){ enemyShoot(e); e.cool = Math.round(CONFIG.enemies[e.type].coolReset*(1-prog()*D.coolK)); }
      // 孵化子体：读取 spawnChildren 配置
      const ecfg=CONFIG.enemies[e.type];
      if(ecfg.spawnChildren){ e.spawnCool=(e.spawnCool||ecfg.spawnChildren.interval)-1; if(e.spawnCool<=0&&enemies.length<ecfg.spawnChildren.max){ const cc=ecfg.spawnChildren, lc=CONFIG.enemies[cc.type]; enemies.push({type:cc.type,x:e.x+(Math.random()<.5?-50:50),y:e.y+10,baseX:0,w:lc.w,h:lc.h,hp:lc.hp,maxhp:lc.hp,vy:lc.vy,vx:0,score:lc.score,cool:lc.coolInit(1)}); e.spawnCool=cc.interval+(Math.random()*120|0); } }
      if(e.y>H+60){ enemies.splice(i,1); continue; }
      // bullet hits
      for(let j=bullets.length-1;j>=0;j--){
        const b=bullets[j];
        if(Math.abs(b.x-e.x)<e.w/2 && Math.abs(b.y-e.y)<e.h/2){
          const ecfg=CONFIG.enemies[e.type];
          // Guardian 外环格挡：子弹离核心超出 shieldRadius 则被环吸收
          if(ecfg.shieldRadius){ const gd=Math.hypot(b.x-e.x,b.y-e.y); if(gd>ecfg.shieldRadius){ bullets.splice(j,1); explode(b.x,b.y,'#ffe8a0',4,2); continue; } }
          e.hp-=b.dmg; bullets.splice(j,1); addRage(CONFIG.player.ultimate.gains.hit);
          explode(b.x,b.y,'#9fe8ff',5,3);
          if(e.hp<=0){
            // 死亡分裂：读取 onDeath.spawn 配置生成子体
            if(ecfg.onDeath?.spawn){ const ds=ecfg.onDeath.spawn; for(let k=0;k<ds.count;k++) enemies.push({type:ds.type,x:e.x+(Math.random()*30-15),y:e.y,baseX:0,w:ds.w,h:ds.h,hp:ds.hp,maxhp:ds.hp,vy:ds.vy,vx:(Math.random()<.5?-ds.vx:ds.vx),score:ds.score,cool:9999,contactDmg:ds.contactDmg}); }
            score+=e.score; kills++; addRage(e.score/100 * CONFIG.player.ultimate.gains.kill);
            hookEnemyKill(getSkin(player.skin));
            explode(e.x,e.y, ecfg?.explodeColor||'#ff6a8a', ecfg?.explodeSize||20, 5);
            if(Math.random()<CONFIG.powerups.enemyDrop) spawnPowerup(e.x, e.y);
            if(Math.random()<CONFIG.powerups.coinDrop) spawnCoin(e.x, e.y, Math.max(2, Math.round(e.score/8)));
            enemies.splice(i,1); updateHUD(); break;
          }
        }
      }
      // enemy touches player
      if(state===State.PLAY && invuln<=0 && invincT<=0 && Math.abs(e.x-player.x)<(e.w/2+16) && Math.abs(e.y-player.y)<(e.h/2+18)){
        const ed=CONFIG.enemies[e.type].contactDmg||CONFIG.player.contactDmg;   // 陨石等可单独设定撞击伤害
        enemies.splice(i,1); explode(e.x,e.y,'#ff6a8a',18,4); hitPlayer(ed);
      }
    }

    // 大招：按战机类型分派
    if(ultActive){
      ultT--;
      const sk=getSkin(player.skin);
      const U={...CONFIG.player.ultimate, ...(sk.ultimate||{})};
      switch(U.type){
        case 'beam': // 先锋·轨道炮
          const bw=U.beam.w;
          for(let i=enemies.length-1;i>=0;i--){
            const e=enemies[i];
            if(Math.abs(e.x-player.x) < bw/2 + e.w/2){
              e.hp -= U.beam.dmg;
              if(e.hp<=0){ score+=e.score; kills++; explode(e.x,e.y,'#ffb13b',24,6); if(Math.random()<CONFIG.powerups.enemyDrop) spawnPowerup(e.x,e.y); if(Math.random()<CONFIG.powerups.coinDrop) spawnCoin(e.x,e.y, Math.max(2, Math.round(e.score/8))); enemies.splice(i,1); updateHUD(); }
            }
          }
          if(boss && Math.abs(boss.x-player.x) < bw/2 + boss.w/2) boss.hp=Math.max(0, boss.hp - boss.maxhp*U.beam.bossDmg);
          break;
        case 'barrage': // 突击·暴风雨
          const bc=U.barCount, sp=U.barSpread, m=atkMul(), skBul=getSkin(player.skin).bullet;
          for(let i=0;i<bc;i++){
            const ang=(i-(bc-1)/2)*sp;
            bullets.push({x:player.x+Math.sin(ang)*16, y:player.y-4, w:5, h:12, vx:Math.sin(ang)*3, vy:-8, dmg:Math.round((U.beam?.dmg||14)*U.barDmgMul*m), glow:skBul.glow, fill:skBul.fill, shape:skBul.shape});
          }
          break;
      }
      if(ultT<=0){ ultActive=false; slowFactor=1; slowEnemyFactor=1; }
    } else if(state===State.PLAY){
      const skU={...CONFIG.player.ultimate, ...(getSkin(player.skin).ultimate||{})};
      if(skU.gains?.passive>0) addRage(skU.gains.passive/60);
    }

    // enemy bullets
    for(let i=eBullets.length-1;i>=0;i--){
      const b=eBullets[i]; b.y+=b.vy*slowFactor; b.x+=(b.vx||0)*slowFactor;
      if(b.y>H+20||b.y<-30||b.x<-20||b.x>W+20){ eBullets.splice(i,1); continue; }
      if(state===State.PLAY && invuln<=0 && invincT<=0 && Math.abs(b.x-player.x)<16 && Math.abs(b.y-player.y)<18){
        if(!hookBulletHit(getSkin(player.skin), b.x, b.y)){ eBullets.splice(i,1); hitPlayer(b.dmg); }
      }
    }

    // particles
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.life-=0.03;
      if(p.life<=0) particles.splice(i,1);
    }
  }
  function hitPlayer(dmg){
    dmg=hookPlayerHit(getSkin(player.skin), dmg);
    if(invItems.shieldHits>0){   // 护盾：吸收本次伤害（默认 3 次）
      invItems.shieldHits--; explode(player.x,player.y,'#8ad7ff',14,4);
      showToast('护盾抵消！剩余 '+invItems.shieldHits); updateHUD(); return;
    }
    hp-=dmg; invuln=CONFIG.player.invuln; addRage(dmg * CONFIG.player.ultimate.gains.hurt);
    explode(player.x,player.y,'#ff4d6d',16,4);
    if(hp<=0){
      lives--;
      if(lives<=0){ updateHUD(); gameOver(); return; }
      hp=maxHP;
    }
    updateHUD();
  }

  // ============ Draw ============
  function drawSpace(){
    // deep-space base wash
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0a0620'); bg.addColorStop(.5,'#070417'); bg.addColorStop(1,'#04020d');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    // 预渲染星云（每帧仅 drawImage 一次，避免重建渐变）
    if(nebCanvas.width) ctx.drawImage(nebCanvas,0,0,W,H);

    // distant planets
    if(planets) for(const p of planets){
      const py = p.y0 + Math.sin(tick*0.0008 + p.drift)*6;
      if(p.ring){
        ctx.save(); ctx.translate(p.cx,py); ctx.rotate(-0.5);
        ctx.strokeStyle='rgba(255,200,230,.12)'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.ellipse(0,0,p.r*1.7,p.r*0.55,0,0,7); ctx.stroke();
        ctx.restore();
      }
      const g=ctx.createRadialGradient(p.cx-p.r*0.35, py-p.r*0.35, p.r*0.2, p.cx, py, p.r);
      g.addColorStop(0,p.c1); g.addColorStop(1,p.c2);
      ctx.globalAlpha=0.40; ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(p.cx,py,p.r,0,7); ctx.fill();
      ctx.globalAlpha=1;
    }

    // twinkling parallax stars
    for(const s of stars){
      s.tw += s.tws;
      const tw = 0.55 + Math.sin(s.tw)*0.45;
      if(s.z>0.75){ // 亮星用预渲染光晕精灵（极廉价）
        const a=s.z*tw;
        ctx.globalAlpha=Math.min(1,a);
        const r=s.r*3.4;
        ctx.drawImage(glowCache.soft, s.x-r, s.y-r, r*2, r*2);
      } else {
        ctx.globalAlpha = s.z*tw;
        ctx.fillStyle = s.tint;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
      }
    }
    ctx.globalAlpha=1;

    // 精致柔光尘埃粒子（前景漂浮，降低亮度避免干扰操作）
    if(motes) for(const m of motes){
      m.tw+=m.tws;
      const tw=0.45+Math.sin(m.tw)*0.55;
      ctx.globalAlpha=0.10+0.22*tw;
      const r=m.r*3.2;
      ctx.drawImage(glowCache.soft, m.x-r, m.y-r, r*2, r*2);
    }
    ctx.globalAlpha=1;

    // shooting stars / meteors
    if(meteors) for(const m of meteors){
      ctx.globalAlpha=Math.max(0,m.life);
      const g=ctx.createLinearGradient(m.x,m.y, m.x-m.vx/ (Math.hypot(m.vx,m.vy))*m.len, m.y-m.vy/(Math.hypot(m.vx,m.vy))*m.len);
      g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle=g; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(m.x,m.y);
      const inv=m.len/Math.hypot(m.vx,m.vy);
      ctx.lineTo(m.x-m.vx*inv, m.y-m.vy*inv); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  function updateSpace(){
    // parallax scroll by depth
    for(const s of stars){ s.y += s.z*2.4*(1+ (diffMul?diffMul:1)*0.04); if(s.y>H){ s.y=-2; s.x=Math.random()*W; } }
    // meteors
    const M=BG.meteor;
    meteorTimer--;
    if(meteorTimer<=0){ if(Math.random()<M.chance) spawnMeteor(); meteorTimer=M.timerBase+Math.random()*M.timerR|0; }
    if(meteors) for(let i=meteors.length-1;i>=0;i--){ const m=meteors[i]; m.x+=m.vx; m.y+=m.vy; m.life-=0.012; if(m.life<=0||m.y>H+30||m.x<-40||m.x>W+40) meteors.splice(i,1); }
    if(motes) for(const m of motes){
      m.y+=m.vy; m.sway+=m.sws; m.x+=Math.sin(m.sway)*m.amp*0.3;
      if(m.y>H+4){ m.y=-4; m.x=Math.random()*W; }
    }
  }
  // 子弹绘制：敌机子弹向下飞（vy>0）弹头朝行进方向，主机子弹向上飞弹头朝上
  function drawBullet(b){
    const g=glowFor(b.glow||ENEMY_BULLET.glow);
    ctx.globalAlpha=0.8; ctx.drawImage(g, b.x-b.w, b.y-b.h*1.5, b.w*2, b.h*3);
    ctx.globalAlpha=1; ctx.fillStyle=b.fill||ENEMY_BULLET.fill;
    const f=(b.vy>0)?1:-1;                      // 弹头朝向：敌机朝下(+1)，主机朝上(-1)
    const w=b.w, h=b.h, x=b.x, y=b.y;
    switch(b.shape||ENEMY_BULLET.shape){
      case 'orb':     // 能量球（对称，方向无关）
        ctx.beginPath(); ctx.ellipse(x, y, w/2, h/2, 0, 0, 7); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x, y, Math.max(1,w/4), 0, 7); ctx.fill();
        break;
      case 'arrow':   // 箭簇：尖头朝行进方向（战斗机 / 炮台 / 导弹僚机）
        ctx.beginPath();
        ctx.moveTo(x, y+f*h);                     // 弹尖（朝前）
        ctx.lineTo(x+w/2, y);
        ctx.lineTo(x, y-f*h*0.45);
        ctx.lineTo(x-w/2, y);
        ctx.closePath(); ctx.fill();
        break;
      case 'shell':   // 炮弹：圆头弹体 + 尖头（泰坦）
        ctx.beginPath();
        ctx.moveTo(x, y+f*h);                     // 弹尖（朝前）
        ctx.lineTo(x+w/2, y+f*h*0.15);
        ctx.lineTo(x+w/2, y-f*h*0.7);
        ctx.lineTo(x-w/2, y-f*h*0.7);
        ctx.lineTo(x-w/2, y+f*h*0.15);
        ctx.closePath(); ctx.fill();
        break;
      case 'shard':   // 菱形能量碎片：上下尖、左右宽，紧凑不显长条（侦察机）
        ctx.beginPath();
        ctx.moveTo(x, y+f*h*0.6);                // 前尖（朝行进方向）
        ctx.lineTo(x+w/2, y);
        ctx.lineTo(x, y-f*h*0.6);
        ctx.lineTo(x-w/2, y);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x, y, Math.max(1,w/3), 0, 7); ctx.fill();
        break;
      default:        // 'bolt' 霓虹长弹：尖头 + 亮芯（先锋号 / 僚机）
        ctx.beginPath();
        ctx.moveTo(x, y+f*h);                     // 弹尖（朝前）
        ctx.lineTo(x+w/2, y+f*h*0.2);
        ctx.lineTo(x+w/2, y-f*h);
        ctx.lineTo(x-w/2, y-f*h);
        ctx.lineTo(x-w/2, y+f*h*0.2);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle='#fff'; ctx.fillRect(x-w/4, y-h, w/2, h*2);
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    drawSpace();

    // particles
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;

    // enemy bullets（各敌机独立样式，复用 drawBullet + 光晕缓存；Boss 子弹回退默认样式）
    for(const b of eBullets) drawBullet(b);

    // player bullets（主机：青色光束；僚机：金色椭圆，明显区分）
    for(const b of bullets) drawBullet(b);

    // enemies
    for(const e of enemies) drawEnemy(e);
    if(boss) drawBoss();
    drawPowerups();
    drawCoins();

    // wingmen behind player
    drawWingmen();
    drawWingBeams();

    // player
    if(state===State.PLAY||state===State.PAUSE) drawPlayer();

    // 限时增益倒计时图标
    if(state===State.PLAY||state===State.PAUSE) drawBuffs();

    // 大招：轨道炮光束 + 怒气条
    if(state===State.PLAY||state===State.PAUSE){
      if(ultActive){
        const sk=getSkin(player.skin);
        const U={...CONFIG.player.ultimate, ...(sk.ultimate||{})};
        switch(U.type){
          case 'beam':   drawUltBeam(); break;
          case 'barrage': drawUltBarrage(); break;
          case 'nova':   drawUltNova(U.dur); break;
          case 'shield': drawUltShield(); break;
          case 'slow':   drawUltSlow(); break;
          case 'overdrive': drawUltOverdrive(); break;
        }
      }
      syncRage();
    }

    // 中央提示文字（火力提升 / 拾取道具）
    if(toastT>0 && (state===State.PLAY)){
      ctx.globalAlpha=Math.min(1, toastT/30);
      ctx.textAlign='center'; ctx.font='800 22px "Segoe UI","PingFang SC",sans-serif';
      ctx.fillStyle='#ffd76a'; ctx.shadowColor='#ffd76a'; ctx.shadowBlur=18;
      ctx.fillText(toastText, W/2, H*0.30);
      ctx.shadowBlur=0; ctx.globalAlpha=1;
    }

    // 关卡横幅
    if(bannerT>0 && (state===State.PLAY)){
      const a=Math.min(1, bannerT/40);
      ctx.globalAlpha=a; ctx.textAlign='center';
      ctx.font='900 40px "Segoe UI","PingFang SC",sans-serif';
      ctx.fillStyle='#ffd76a'; ctx.shadowColor='#ffd76a'; ctx.shadowBlur=24;
      ctx.fillText(bannerText||('第 '+level+' 关'), W/2, H*0.4);
      ctx.font='13px sans-serif'; ctx.shadowBlur=0;
      if(bannerText && bannerText.startsWith('第 ')){
        ctx.fillStyle='#c8b8ff'; ctx.fillText('警戒 · 敌军来袭', W/2, H*0.4+30);
      } else if(gameMode==='bossrush'){
        ctx.fillStyle='#ff8a5c'; ctx.fillText('连续击败全部 '+CONFIG.levels.max+' 个 Boss！', W/2, H*0.4+30);
      } else {
        ctx.fillStyle='#ffd76a'; ctx.fillText('拾取掉落物，即将跃迁…', W/2, H*0.4+30);
      }
      ctx.globalAlpha=1;
    }
  }


  // == Boss 绘制原语 ==
  function bossGradient(b,cs){ const g=ctx.createLinearGradient(0,-b.h/2,0,b.h/2); g.addColorStop(0,'#3a3355'); g.addColorStop(.55,(b.phase>=2)?'#ff2e55':cs); g.addColorStop(1,'#17102b'); return g; }
  function bossCore(b,oy){ const p=6+Math.sin(tick*0.15)*3, e=b.phase>=2; ctx.fillStyle=e?'#ffd0d0':'#fff'; ctx.shadowColor=e?'#ff5b7a':'#fff'; ctx.shadowBlur=16; ctx.beginPath(); ctx.arc(0,oy||6,p,0,7); ctx.fill(); ctx.shadowBlur=0; }
  function bossPhaseBlush(b){ if(b.flash<=0)return; const fa=0.55*Math.min(1,b.flash/26),rg=ctx.createRadialGradient(0,0,4,0,0,b.w*0.95); rg.addColorStop(0,'rgba(255,255,255,'+fa+')'); rg.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=rg; ctx.fillRect(-b.w,-b.h,b.w*2,b.h*2); }
  function bossGlowRing(x,y,r,cs,a){ ctx.strokeStyle=cs; ctx.globalAlpha=a; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.stroke(); ctx.globalAlpha=1; }

  // == 关1：侦察护卫舰 — 梭形箭头飞船 + 舷窗 + 引擎 ==
  function bossDrawFrigate(b){
    const cs=CONFIG.boss.archs[b.arch].color, e=b.phase>=2;
    ctx.save(); ctx.translate(b.x,b.y); ctx.shadowColor=cs; ctx.shadowBlur=e?40:26;
    const g=bossGradient(b,cs); ctx.fillStyle=g;
    const hw=b.w/2, hh=b.h/2;
    // 梭形舰体：菱形
    ctx.beginPath(); ctx.moveTo(0,-hh*0.9); ctx.lineTo(hw*0.4,-hh*0.3); ctx.lineTo(hw*0.5,0); ctx.lineTo(hw*0.4,hh*0.35); ctx.lineTo(-hw*0.4,hh*0.35); ctx.lineTo(-hw*0.5,0); ctx.lineTo(-hw*0.4,-hh*0.3); ctx.closePath(); ctx.fill();
    // 两侧短翼
    if(b.flash<=0){ ctx.fillStyle='rgba(255,255,255,.15)'; ctx.beginPath(); ctx.moveTo(-hw*0.45,2); ctx.lineTo(-hw*0.7,-10); ctx.lineTo(-hw*0.55,-2); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(hw*0.45,2); ctx.lineTo(hw*0.7,-10); ctx.lineTo(hw*0.55,-2); ctx.closePath(); ctx.fill(); }
    // 舷窗3个
    if(b.flash<=0){ ctx.fillStyle='#c8e8ff'; ctx.shadowColor='#22e6ff'; ctx.shadowBlur=6; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc((i-1)*14,-hh*0.15,2.5,0,7); ctx.fill(); } ctx.shadowBlur=0; }
    // 底部双引擎喷口
    if(b.flash<=0){ ctx.fillStyle='#ff9d3d'; ctx.shadowColor='#ff6a2e'; ctx.shadowBlur=10; ctx.beginPath(); ctx.moveTo(-10,hh*0.3); ctx.lineTo(10,hh*0.3); ctx.lineTo(14,hh*0.45); ctx.quadraticCurveTo(0,hh*0.55,-14,hh*0.45); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0; }
    bossPhaseBlush(b); ctx.shadowBlur=0;
    bossCore(b, -hh*0.15);
    ctx.restore();
  }

  // == 关2：守护哨兵 — 筝形盾牌 + 钻石宝石 + 十字能量纹 ==
  function bossDrawSentinel(b){
    const cs=CONFIG.boss.archs[b.arch].color, e=b.phase>=2;
    ctx.save(); ctx.translate(b.x,b.y); ctx.shadowColor=cs; ctx.shadowBlur=e?40:26;
    const g=bossGradient(b,cs); ctx.fillStyle=g;
    const hw=b.w/2, hh=b.h/2;
    // 筝形/八边形盾身（上尖、中宽、下尖收窄）
    ctx.beginPath(); ctx.moveTo(0,-hh*0.95); ctx.lineTo(hw*0.2,-hh*0.55); ctx.lineTo(hw*0.55,-hh*0.2); ctx.lineTo(hw*0.6,hh*0.15); ctx.lineTo(hw*0.25,hh*0.55); ctx.lineTo(0,hh*0.85); ctx.lineTo(-hw*0.25,hh*0.55); ctx.lineTo(-hw*0.6,hh*0.15); ctx.lineTo(-hw*0.55,-hh*0.2); ctx.lineTo(-hw*0.2,-hh*0.55); ctx.closePath(); ctx.fill();
    // 中央菱形宝石
    if(b.flash<=0){ ctx.fillStyle='rgba(255,255,255,.25)'; ctx.shadowColor='#fff'; ctx.shadowBlur=10; ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(14,0); ctx.lineTo(0,20); ctx.lineTo(-14,0); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0; }
    // 十字能量纹
    if(b.flash<=0){ ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(0,-hh*0.6); ctx.lineTo(0,hh*0.5); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-hw*0.35,0); ctx.lineTo(hw*0.35,0); ctx.stroke(); }
    // 边缘光晕环
    if(b.flash<=0) bossGlowRing(0,0,Math.max(hw,hh)*0.75,cs,.12);
    bossPhaseBlush(b); ctx.shadowBlur=0;
    bossCore(b,0);
    ctx.restore();
  }

  // == 关3：双体黄蜂 — 三段昆虫体 + 半透明翅 + 触角 + 尾针 ==
  function bossDrawHornet(b){
    const cs=CONFIG.boss.archs[b.arch].color, e=b.phase>=2;
    ctx.save(); ctx.translate(b.x,b.y); ctx.shadowColor=cs; ctx.shadowBlur=e?40:26;
    const g=bossGradient(b,cs);
    const hw=b.w/2, hh=b.h/2;
    // 腹部（水滴形，下方）
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(-14,12); ctx.quadraticCurveTo(-hw*0.35,hh*0.4,hw*0.0,hh*0.7); ctx.quadraticCurveTo(hw*0.35,hh*0.4,14,12); ctx.closePath(); ctx.fill();
    // 胸部（椭圆）
    ctx.beginPath(); ctx.ellipse(0,0,hw*0.22,hh*0.2,0,0,Math.PI*2); ctx.fill();
    // 头部（小圆）
    ctx.beginPath(); ctx.arc(0,-hh*0.3,hw*0.14,0,7); ctx.fill();
    // 两对半透明翅（贝塞尔弧形）
    if(b.flash<=0){ ctx.fillStyle='rgba(255,255,255,.12)'; ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=1; ctx.beginPath(); ctx.ellipse(-hw*0.15,0,hw*0.24,hh*0.18,-.25,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(hw*0.15,0,hw*0.24,hh*0.18,.25,0,Math.PI*2); ctx.fill(); ctx.stroke(); }
    // 头顶触角
    if(b.flash<=0){ ctx.strokeStyle=cs; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-4,-hh*0.38); ctx.quadraticCurveTo(-12,-hh*0.55,-10,-hh*0.6); ctx.stroke(); ctx.beginPath(); ctx.moveTo(4,-hh*0.38); ctx.quadraticCurveTo(12,-hh*0.55,10,-hh*0.6); ctx.stroke(); }
    // 尾针
    if(b.flash<=0){ ctx.fillStyle='#ffe8c0'; ctx.beginPath(); ctx.moveTo(0,hh*0.65); ctx.lineTo(-4,hh*0.8); ctx.lineTo(0,hh*0.95); ctx.lineTo(4,hh*0.8); ctx.closePath(); ctx.fill(); }
    // 腹节横纹
    if(b.flash<=0){ ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=1; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(-10+Math.abs(i-1)*2,24+i*10); ctx.lineTo(10-Math.abs(i-1)*2,24+i*10); ctx.stroke(); } }
    bossPhaseBlush(b); ctx.shadowBlur=0;
    bossCore(b, -hh*0.3);
    ctx.restore();
  }

  // == 关4：蛛母女王 — 弧形蜘蛛腿 + 8眼 + 腹纹 ==
  function bossDrawArachnid(b){
    const cs=CONFIG.boss.archs[b.arch].color, e=b.phase>=2;
    ctx.save(); ctx.translate(b.x,b.y); ctx.shadowColor=cs; ctx.shadowBlur=e?40:26;
    const g=bossGradient(b,cs);
    const hw=b.w/2, hh=b.h/2, sw=tick*0.03;
    // 腹部（大圆）
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,10,hw*0.28,hh*0.28,0,0,Math.PI*2); ctx.fill();
    // 头胸（小圆）
    ctx.beginPath(); ctx.ellipse(0,-16,hw*0.20,hh*0.18,0,0,Math.PI*2); ctx.fill();
    // 8条弧形蜘蛛腿 — 紧凑三段弧，模拟真实足肢比例
    if(b.flash<=0){
      for(let i=0;i<8;i++){
        const s=i<4?-1:1, idx=i<4?i:7-i, ph=sw+idx*0.6;
        const bx=s*16, by=-8+idx*3;                           // 根（头胸边缘）
        const wv=Math.sin(ph)*5, wv2=Math.sin(ph+1.2)*4;     // 小幅度柔摆
        // coxa→knee：短弧向外（蜘蛛膝向上拱）
        const kx=bx+s*(20+wv), ky=by+12+wv2;
        // knee→ankle：长弧向下弯
        const ax=kx+s*(15-wv), ay=ky+18+wv2;
        // ankle→foot：短弧触地
        const fx=ax+s*(8+wv*0.5), fy=ay+12;
        ctx.strokeStyle=cs; ctx.lineWidth=3.2-idx*0.22; ctx.shadowColor=cs; ctx.shadowBlur=3;
        ctx.beginPath(); ctx.moveTo(bx,by);
        ctx.quadraticCurveTo(bx+s*10, by+5, kx,ky);
        ctx.quadraticCurveTo(kx-s*4, ky+6, ax,ay);
        ctx.quadraticCurveTo(ax+s*3, ay+4, fx,fy);
        ctx.stroke();
        ctx.fillStyle=cs; ctx.beginPath(); ctx.arc(fx,fy,2.2-idx*0.15,0,7); ctx.fill();
      }
      ctx.shadowBlur=0;
    }
    // 8眼（两行）
    if(b.flash<=0){ ctx.fillStyle='#ff2020'; ctx.shadowColor='#ff0000'; ctx.shadowBlur=5;
    for(let r=0;r<2;r++){ for(let c=0;c<4;c++){ ctx.beginPath(); ctx.arc((c-1.5)*5,-22+r*5,1.8,0,7); ctx.fill(); } } ctx.shadowBlur=0; }
    // 腹部斑纹
    if(b.flash<=0){ ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0,6,hw*0.1,hh*0.06,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(0,16,hw*0.08,hh*0.05,0,0,Math.PI*2); ctx.fill(); }
    bossPhaseBlush(b); ctx.shadowBlur=0;
    bossCore(b, -16);
    ctx.restore();
  }

  // == 关5：无畏战舰 — 重型巡洋舰 + 多层桥楼 + 炮管 + 撞角 ==
  function bossDrawDreadnought(b){
    const cs=CONFIG.boss.archs[b.arch].color, e=b.phase>=2;
    ctx.save(); ctx.translate(b.x,b.y); ctx.shadowColor=cs; ctx.shadowBlur=e?40:26;
    const g=bossGradient(b,cs);
    const hw=b.w/2, hh=b.h/2;
    // 船体（箭头形）
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(0,-hh*0.8); ctx.lineTo(hw*0.5,-hh*0.3); ctx.lineTo(hw*0.6,hh*0.2); ctx.lineTo(hw*0.35,hh*0.5); ctx.lineTo(-hw*0.35,hh*0.5); ctx.lineTo(-hw*0.6,hh*0.2); ctx.lineTo(-hw*0.5,-hh*0.3); ctx.closePath(); ctx.fill();
    // 两层桥楼
    if(b.flash<=0){ ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(-20,-hh*0.6,40,18); ctx.fillRect(-14,-hh*0.5,28,12); }
    // 舰艏撞角
    if(b.flash<=0){ ctx.fillStyle='rgba(255,255,255,.4)'; ctx.beginPath(); ctx.moveTo(0,-hh*0.78); ctx.lineTo(-5,-hh*0.95); ctx.lineTo(5,-hh*0.95); ctx.closePath(); ctx.fill(); }
    // 5门炮管（两舷伸出）
    if(b.flash<=0){ ctx.fillStyle=cs; ctx.shadowColor=cs; ctx.shadowBlur=6;
    for(let i=0;i<5;i++){ const x=(i-2)*12, y=hh*0.1+i*3; ctx.fillRect(x-2,y,4,16); } ctx.shadowBlur=0; }
    // 引擎光焰
    if(b.flash<=0){ ctx.fillStyle='rgba(100,180,255,.5)'; ctx.beginPath(); ctx.moveTo(-15,hh*0.45); ctx.lineTo(15,hh*0.45); ctx.lineTo(10,hh*0.65); ctx.quadraticCurveTo(0,hh*0.7,-10,hh*0.65); ctx.closePath(); ctx.fill(); }
    bossPhaseBlush(b); ctx.shadowBlur=0;
    bossCore(b, -hh*0.55);
    ctx.restore();
  }

  // == 关6：凤凰 — 火焰鸟 + 羽翼层次 + 长尾羽 + 火粒子 ==
  function bossDrawPhoenix(b){
    const cs=CONFIG.boss.archs[b.arch].color, e=b.phase>=2, fl=Math.sin(tick*0.07)*10;
    ctx.save(); ctx.translate(b.x,b.y); ctx.shadowColor=cs; ctx.shadowBlur=e?40:26;
    const g=bossGradient(b,cs);
    const hw=b.w/2, hh=b.h/2;
    // 身体（纺锤形）
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,hw*0.16,hh*0.35,0,0,Math.PI*2); ctx.fill();
    // 弯曲颈部 + 头
    ctx.beginPath(); ctx.moveTo(0,-hh*0.28); ctx.quadraticCurveTo(-6,-hh*0.48,0,-hh*0.55); ctx.quadraticCurveTo(4,-hh*0.5,5,-hh*0.4); ctx.closePath(); ctx.fill();
    // 双层羽翼（分叉贝塞尔弧形）
    if(b.flash<=0){ ctx.fillStyle='rgba(255,177,59,.25)'; ctx.shadowColor='rgba(255,177,59,.4)'; ctx.shadowBlur=12;
    //左翼
    ctx.beginPath(); ctx.moveTo(-8,-8); ctx.quadraticCurveTo(-hw*0.25+fl,-28,-hw*0.45+fl,-56); ctx.quadraticCurveTo(-hw*0.3,16,-hw*0.12,0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6,-2); ctx.quadraticCurveTo(-hw*0.35+fl*0.8,-18,-hw*0.55+fl*0.8,-42); ctx.quadraticCurveTo(-hw*0.4,8,-hw*0.1,4); ctx.closePath(); ctx.fill();
    //右翼
    ctx.beginPath(); ctx.moveTo(8,-8); ctx.quadraticCurveTo(hw*0.25-fl,-28,hw*0.45-fl,-56); ctx.quadraticCurveTo(hw*0.3,16,hw*0.12,0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6,-2); ctx.quadraticCurveTo(hw*0.35-fl*0.8,-18,hw*0.55-fl*0.8,-42); ctx.quadraticCurveTo(hw*0.4,8,hw*0.1,4); ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0; }
    // 三根长尾羽
    if(b.flash<=0){ ctx.strokeStyle='rgba(255,177,59,.5)'; ctx.lineWidth=3; const tw=tick*0.03;
    ctx.beginPath(); ctx.moveTo(0,hh*0.28); ctx.quadraticCurveTo(-8,hh*0.5,-15+Math.sin(tw)*6,hh*0.7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,hh*0.28); ctx.quadraticCurveTo(0,hh*0.55,Math.cos(tw)*8,hh*0.75); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,hh*0.28); ctx.quadraticCurveTo(8,hh*0.5,15+Math.sin(tw+1)*6,hh*0.7); ctx.stroke(); }
    // 喙
    if(b.flash<=0){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(-2,-hh*0.52); ctx.lineTo(-4,-hh*0.58); ctx.lineTo(4,-hh*0.55); ctx.closePath(); ctx.fill(); }
    // 火焰粒子圈
    ctx.fillStyle='rgba(255,177,59,.2)'; for(let i=0;i<8;i++){ const a=i/8*Math.PI*2+tick*0.02, r=hh*0.4+Math.sin(tick*0.1+i)*8; ctx.beginPath(); ctx.arc(Math.cos(a)*r,Math.sin(a)*r,2.5,0,7); ctx.fill(); }
    bossPhaseBlush(b); ctx.shadowBlur=0;
    bossCore(b, -hh*0.05);
    ctx.restore();
  }

  // == 关7：冰霜巨蟒 — 10节水晶菱形蛇身 + 背脊冰刺 + 张开下颚 ==
  function bossDrawFrostwyrm(b){
    const cs=CONFIG.boss.archs[b.arch].color, e=b.phase>=2, sw2=tick*0.03;
    ctx.save(); ctx.translate(b.x,b.y); ctx.shadowColor=cs; ctx.shadowBlur=e?40:26;
    const seg=10, sLen=11, offY=b.h*0.35;
    // 蛇身节片（菱形沿正弦曲线排列）
    for(let i=seg-1;i>=0;i--){
      const wave=Math.sin(i*0.45+tick*0.04)*14, ox=wave, oy=offY-i*sLen, r=14-i*0.8;
      const g2=bossGradient(b,cs); ctx.fillStyle=g2;
      ctx.beginPath(); ctx.moveTo(ox,oy-r); ctx.lineTo(ox+r*0.7,oy+r*0.2); ctx.lineTo(ox,oy+r*0.5); ctx.lineTo(ox-r*0.7,oy+r*0.2); ctx.closePath(); ctx.fill();
      // 背脊冰刺
      if(b.flash<=0){ ctx.fillStyle='rgba(200,240,255,.5)'; ctx.beginPath(); ctx.moveTo(ox+r*0.35,oy-r*0.6); ctx.lineTo(ox+r*0.55,oy-r*1.1); ctx.lineTo(ox+r*0.25,oy-r*0.7); ctx.closePath(); ctx.fill(); }
    }
    // 头部（大菱形）
    const hx=Math.sin(0*0.45+sw2*1.5)*14, hy=offY-0*sLen;
    ctx.fillStyle=bossGradient(b,cs); ctx.beginPath(); ctx.moveTo(hx,hy-22); ctx.lineTo(hx+16,hy+2); ctx.lineTo(hx,hy+10); ctx.lineTo(hx-16,hy+2); ctx.closePath(); ctx.fill();
    // 张开下颚（两个三角形）
    if(b.flash<=0){ ctx.fillStyle='rgba(110,224,255,.4)'; ctx.beginPath(); ctx.moveTo(hx-8,hy+6); ctx.lineTo(hx-16,hy+22); ctx.lineTo(hx-2,hy+10); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(hx+8,hy+6); ctx.lineTo(hx+16,hy+22); ctx.lineTo(hx+2,hy+10); ctx.closePath(); ctx.fill(); }
    // 冰蓝双眼
    if(b.flash<=0){ ctx.fillStyle='#fff'; ctx.shadowColor='#6ee0ff'; ctx.shadowBlur=8; ctx.beginPath(); ctx.arc(hx-6,hy-14,3.5,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(hx+6,hy-14,3.5,0,7); ctx.fill(); ctx.fillStyle='#1a3a4a'; ctx.shadowBlur=0; ctx.beginPath(); ctx.arc(hx-6,hy-14,1.8,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(hx+6,hy-14,1.8,0,7); ctx.fill(); }
    bossPhaseBlush(b); ctx.shadowBlur=0;
    ctx.restore();
  }

  // == 关8：雷狱泰坦 — 闪电巨人半身 + 王冠角 + 掌心向前 ==
  function bossDrawTitan(b){
    const cs=CONFIG.boss.archs[b.arch].color, e=b.phase>=2;
    ctx.save(); ctx.translate(b.x,b.y); ctx.shadowColor=cs; ctx.shadowBlur=e?40:26;
    const g=bossGradient(b,cs);
    const hw=b.w/2, hh=b.h/2, z=tick*0.02;
    // 全身闪电折线轮廓（巨人上半身）
    ctx.fillStyle=g; ctx.beginPath();
    // 头顶
    ctx.moveTo(0,-hh*0.9); ctx.lineTo(-6,-hh*0.7); ctx.lineTo(4,-hh*0.65); ctx.lineTo(-2,-hh*0.45);
    // 左肩→左臂
    ctx.lineTo(-hw*0.8,-hh*0.25); ctx.lineTo(-hw*0.6,-hh*0.05); ctx.lineTo(-hw*0.85,hh*0.1); ctx.lineTo(-hw*0.7,hh*0.3); ctx.lineTo(-hw*0.5,hh*0.5);
    // 身体→右臂
    ctx.lineTo(hw*0.5,hh*0.5); ctx.lineTo(hw*0.7,hh*0.3); ctx.lineTo(hw*0.85,hh*0.1); ctx.lineTo(hw*0.6,-hh*0.05); ctx.lineTo(hw*0.8,-hh*0.25);
    // 右肩→回头顶
    ctx.lineTo(2,-hh*0.45); ctx.lineTo(hw*0.1,-hh*0.65); ctx.lineTo(6,-hh*0.7);
    ctx.closePath(); ctx.fill();
    // 白色能量描边

  function drawBoss(){
    const b=boss, A=CONFIG.boss.archs[b.arch];
